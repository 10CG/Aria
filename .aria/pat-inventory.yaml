# Aria 应用级 Forgejo token 台账 —— 只存元数据, 零 secret 值 (git 跟踪)
#
# 归属判据 (owner 2026-08-08 决策 `.aria/decisions/2026-08-08-credential-rotation-ownership-transfer-to-aether.md`
# + 2026-08-30 裁定): 「谁有轮换执行面谁管」, 逐凭据判、不按类判。三方各管一层:
#   - Forgejo 实例 (LXC 300 @ pve-node2, 备份/升级/链路)              → 10cg.local (它明文不存 token)
#   - 账号模型 / 机器账号 10cg-ci-bot / 规则 / 轮换原语 / 集群级 token   → Aether
#       (T2 docker_auth_* 镜像拉取 · T3 org CI · T4 aria-build 推镜像;
#        SOT = Aether/.aether/pat-inventory.yaml + Aether/docs/guides/forgejo-token-map.md)
#   - 应用级 token (Aria 运行时代码自己消费的那几枚)                     → Aria = 本文件
#
# 指纹算法: sha256(token 原文, 无换行) 的 hex 前 8 位。与 Aether 台账同算法
# (Aether 记的 `sha256=446b79` 与本机算出的 aria-build 那枚 `446b7916` 是同一前缀)。
# 活性 + 指纹漂移检查: .aria/probes/forgejo-app-token-liveness.py
# (state-check `forgejo-app-token-liveness`, 每次 /state-scanner 跑; 只输出 http code / 指纹 / 判定)。
# scope 验证 (push 权限) 无法用 GET 非破坏地测, 走 scratchpad 探针 `git push --dry-run` (见各条 reissue_plan)。
#
# 新增 / 轮换 / 吊销任何一枚 Aria token 时, 三件事同批: 改本文件 → 跑活性检查 → 若吊销, 先枚举全部 store
# (Aether H1 教训: 一处指纹 = 假完整)。

version: "1"
fingerprint_algo: sha256-hex-prefix-8

defaults:
  account: 10cg-ci-bot                              # Forgejo user id=6; 2026-07-01 前名 aria-runner-bot
  forgejo_internal_url: http://192.168.69.200:3000  # 生产消费点走内网 (initial.sh:46), 绕过 CF Access 平面
  nomad_addr: http://192.168.69.70:4646
  # 命名对齐现行实态 (2026-09-02 与 Aether 台账/轮换 runbook 核实; 初版自拟的 aria-<consumer>-<yyyymmdd> 作废):
  # <用途>-<YYYY>-Q<n> —— Q 是签发季度 cohort, 轮换时随台账改名 (先例: todo-web-ci-2026-Q3 [2026-08-08 最新真实签发] /
  # org-ci-shared-2026-Q3 / aria-build-bot-2026-Q3 / cluster-registry-pull Q2→Q3 [commit e40dcc1])。
  # 登记要求 (Aether #292 closed 已采纳): 新 token 必记 account + forgejo_token_name, 光有指纹在 Forgejo UI 定位不了。
  naming_convention: "<purpose>-<YYYY>-Q<n>"

tokens:
  # ── Layer 1 (Hermes light-1, aria-layer1 extension): 读 issue / 写评论 / 查 PR ──
  - id: aria-layer1-forgejo
    status: active
    forgejo_token_name: aria-runner-bot            # 2026-05-03 签发, 改名前的旧命名; Aria#151 表第二行
    fingerprint: c957308a
    issued_at: "2026-05-03"
    scope: [read:repository, write:issue]          # 2026-08-30 实测: issues GET 200 / git ls-remote OK / push --dry-run 403 / GET user 403 (缺 read:user)
    store:
      type: nomad-variable
      path: nomad/jobs/aria-orchestrator
      key: FORGEJO_BOT_PAT
    consumers:
      - "aria-orchestrator/hermes-extensions/aria-layer1 (issue poll / comment_poll / reconcile / PR 状态查询)"
    liveness:
      enabled: true
      endpoint: repos/10CG/Aria/issues/188
      expect: 200
    rotation:
      policy: permanent                            # owner 2026-09-02 裁定: 不设强制轮换周期 (Forgejo token 默认不过期)。
                                                   # 补偿控制 = 每次 /state-scanner 的活性+指纹漂移检查;
                                                   # 泄露时走即时吊销重签 (先枚举全 store, 对齐 Aether emergency rotation)
      due: null
    last_verified: "2026-08-30"
    notes: "同变量里 FORGEJO_BOT_USER=aria-runner-bot 是过期用户名 (纯卫生, 不影响鉴权); 下次碰该变量时改 10cg-ci-bot"

  # ── Layer 2 (aria-runner 容器 @ heavy 节点): clone / push 分支 / 开 PR ──
  - id: aria-layer2-git
    status: active                                 # 2026-09-02 重签生效 (旧值 fp ed07d152 自 ~05-23 死, 08-29 发现, 09-02 覆盖)
    forgejo_token_name: aria-layer2-git-2026-Q3
    fingerprint: 3105220d
    issued_at: "2026-09-02"
    scope_required: [write:repository, write:issue]   # clone/push + 开 PR/评论; 不要 write:package (镜像拉取已由 Aether 的 docker_auth_* 承担)
    store:
      type: nomad-variable
      path: nomad/jobs/aria-layer2-runner
      key: FORGEJO_BOT_PAT
    consumers:
      - "aria-orchestrator/docker/aria-runner/modes/initial.sh:602 clone URL (用户名字面量 aria-runner-bot 待改 10cg-ci-bot, 纯卫生)"
      - "initial.sh:764 PR 查询 / :854 开 PR / :268 default_branch 回落 / :549 fetch 模式取 issue (M6 feature 分支)"
    liveness:
      enabled: true
      endpoint: repos/10CG/Aria
      expect: 200
    write_path: "aether env set --job aria-layer2-runner FORGEJO_BOT_PAT --from-file <f>  (CAS 安全单键写; 等价: nomad var get -out=json → 只改此键 → put -check-index)"
    history: >
      2026-09-02 重签闭环: owner 经 write_path 写入 → heavy-node 实证 git ls-remote rc=0 (8 refs) +
      push --dry-run rc=0 (write:repository 实证, dry-run 不落引用、已复核远端无该分支) + 内网
      issue/repo GET 200 合法 JSON → 本条回填 → state-check 转绿。旧死值 fp ed07d152 (最可能 =
      2026-05-23 吊销的 "aria layer2 runner 2026 05 22") 已被覆盖, Forgejo 侧无可吊销项。
    rotation:
      policy: permanent                            # owner 2026-09-02 裁定 (同上条): 不设强制轮换周期
      due: null
    last_verified: "2026-09-02"

  # ── 已 deprecate 的 job 残留 ──
  - id: aria-runner-template-legacy
    status: deprecated_dead
    fingerprint: 2c3fdb16
    store:
      type: nomad-variable
      path: nomad/jobs/aria-runner-template
      key: FORGEJO_BOT_PAT
    liveness:
      enabled: false                               # 不检查: job 已 deprecate (DEC-20260523-001), 变量 2026-04-22 后未动, token 已死
    notes: "处置 (owner): 删该变量 (或随 job 一起清)。删前枚举: 仅此一处 store"

# 指针: 不归本文件、但与 Aria 变量/账号交叉的凭据 —— 只指向, 不重复登记
not_owned_here:
  - what: "docker_auth_user / docker_auth_password (nomad/jobs/aria-layer2-runner 等 Aria job 变量内)"
    owner: "Aether T2 cluster-registry-pull-2026-Q3 (Aether/.aether/pat-inventory.yaml); Tier-1 rotate 自动写"
  - what: "FORGEJO_BOT_PAT (nomad/jobs/aria-build)"
    owner: "Aether T4 aria-build-bot-2026-Q3 (fp 446b7916, write:package); aether-build-container skill 注入"
  - what: "token aria-runner-bot-prod-20260523-v2-full-scope (fp 5aaff023, 10cg-ci-bot)"
    status: "Aria 自 2026-07-12 起无消费点 (节点级 docker auth 已由 job 级 docker_auth_* 取代; 07-02 前在 heavy-4 config)。不复用 (含 write:package 过宽)。建议 Aether 枚举 store 后吊销 —— Aria#151 回复"

# 同一 Nomad 变量里的键级归属 (混住没问题, 写下来就不乱)
key_ownership:
  nomad/jobs/aria-layer2-runner:
    FORGEJO_BOT_PAT: Aria
    "ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL / ANTHROPIC_DEFAULT_*_MODEL / ZHIPU_API_KEY / ZHIPU_BASE_URL": Aria
    "docker_auth_user / docker_auth_password": Aether (T2)
  nomad/jobs/aria-orchestrator:
    "FORGEJO_BOT_PAT / FORGEJO_BOT_USER / LUXENO_API_KEY / ARIA_FEISHU_* / ARIA_AUTHORIZED_APPROVERS / ARIA_BOT_USERNAME": Aria
  nomad/jobs/aria-build:
    "FORGEJO_BOT_PAT / FORGEJO_BOT_USER / FORGEJO_REGISTRY / ARIA_IMAGE_REPO": Aether (T4)
