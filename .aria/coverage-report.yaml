_historical_gap_rationale:
  spec-fix-author: |
    勘正由原作者执笔时错误系统性逃逸 (memory feedback_author_and_verifier_must_differ_for_corrections)。
    config.audit.teams 的 5 席全是审计席位 —— 从中选执笔方会造成「执笔方兼审计席位」的结构性冲突
    (2026-08 premerge-gate 轨第 3 条编排层错误, R1-fix 用 tech-lead 时发生)。R2-fix 起改用名单外执笔方, 冲突消除。
    2026-08-13 之前由 general-purpose 顶替, 无 capabilities 标签、无 STCO 定义。
  adversarial-reviewer: |
    最有价值的一次产出来自它: 10 席裁定工作流里 5 席对抗复核**推翻了 2 席的处方**,
    而那 2 席的**证据全部成立** —— 错的是从证据推出的处方。
    主 loop 独立复核证据 ≠ 对抗复核建议。该能力在原 roster 里无专门承载。
    2026-08-13 之前由 aria:tech-lead 以 refute-prompt 临时充当。

