version: "1"

# 项目级自定义健康检查 — 由 state-scanner Phase 1.11 串行执行
# 设计目的: 对 state-scanner 各可选/opt-in 阶段做"是否真的跑了"的反向验证,
# 防止 AI 在执行时跳过某个阶段 (如 Phase 1.13 Issue 感知) 却没人发现。
#
# 关键不变量: Phase 1.11 是硬编码执行的 (不像 Phase 1.13 需读 config 判断),
# 所以在这里放探针 = 利用可靠阶段监视不可靠阶段。

checks:
  # --- Issue 扫描新鲜度 (防止 Phase 1.13 被跳过) ---
  - name: "issue-cache-freshness"
    description: |
      若 issue_scan.enabled=true, 则 .aria/cache/issues.json 必须存在且
      在 2×TTL (默认 30min) 内。陈旧或缺失意味着 Phase 1.13 未执行
      (或被 AI 跳过)。此检查是 Phase 1.13 是否真的跑了的反向证据。
    command: |
      if ! grep -q '"issue_scan"' .aria/config.json 2>/dev/null; then
        echo "OK (disabled)"; exit 0
      fi
      if ! grep -A2 '"issue_scan"' .aria/config.json | grep -q '"enabled": true'; then
        echo "OK (disabled)"; exit 0
      fi
      if [ ! -f .aria/cache/issues.json ]; then
        echo "MISSING — Phase 1.13 never ran"; exit 1
      fi
      if [ -z "$(find .aria/cache/issues.json -mmin -30 2>/dev/null)" ]; then
        echo "STALE — cache > 30min, Phase 1.13 likely skipped"; exit 1
      fi
      echo "OK"
    severity: warning
    fix: "rm .aria/cache/issues.json && 重跑 /state-scanner 触发 Phase 1.13 live fetch"
    timeout_seconds: 5
    enabled: true

  # --- silknode-integration-contract deferred-acceptance expiry ---
  - name: "silknode-contract-deferral-expiry"
    description: |
      Watches the silknode-integration-contract Spec waiver decision file.
      Per 2026-05-07 3-round Spec discussion loop convergence:
      - Spec archived 2026-05-07 with explicit waiver until 2026-08-05
      - Contract 2 (业务数据分类约束) was never mechanically enforced in M2
      - This probe is the "detection stub" deliverable from R3 convergence
        (closes qa-engineer R2 objection #c "scaffold-helpers-drift risk")
      WARN (not BLOCK) if expires_at past now() — waiver renewal / Spec
      re-evaluation required per .aria/decisions/2026-05-07-silknode-contract-*.
    command: |
      WAIVER='.aria/decisions/2026-05-07-silknode-contract-archive-with-deferred-acceptance.md'
      if [ ! -f "$WAIVER" ]; then
        echo "OK (waiver file absent — likely pre-2026-05-07 state)"; exit 0
      fi
      EXPIRES=$(grep -E '^expires_at:' "$WAIVER" | head -1 | sed -E 's/^expires_at:[[:space:]]*//; s/T.*$//; s/[[:space:]]*$//')
      if [ -z "$EXPIRES" ]; then
        echo "MALFORMED — expires_at not found in $WAIVER"; exit 1
      fi
      EPOCH_EXPIRES=$(date -d "$EXPIRES" +%s 2>/dev/null)
      EPOCH_NOW=$(date +%s)
      if [ -z "$EPOCH_EXPIRES" ]; then
        echo "MALFORMED — expires_at '$EXPIRES' not parseable"; exit 1
      fi
      if [ "$EPOCH_NOW" -gt "$EPOCH_EXPIRES" ]; then
        DAYS_OVER=$(( (EPOCH_NOW - EPOCH_EXPIRES) / 86400 ))
        echo "EXPIRED — silknode-contract waiver past $EXPIRES (${DAYS_OVER}d over)"
        exit 1
      fi
      DAYS_LEFT=$(( (EPOCH_EXPIRES - EPOCH_NOW) / 86400 ))
      echo "OK (${DAYS_LEFT}d until waiver expiry $EXPIRES)"
    severity: warning
    fix: |
      1. Read .aria/decisions/2026-05-07-silknode-contract-archive-with-deferred-acceptance.md §重新评估时 SOP
      2. Check deferred acceptance items (c) US-025 status + (d) US-026/PRD anchor status
      3. Decide: close waiver (all MET) / renew waiver (new file, new expires_at) / upgrade to standards/governance/silknode-no-storage.md
    timeout_seconds: 5
    enabled: true
