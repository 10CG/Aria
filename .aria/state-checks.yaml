version: "1"

# 项目级自定义健康检查 — 由 state-scanner Phase 1.11 串行执行
# 设计目的: 对 state-scanner 各可选/opt-in 阶段做"是否真的跑了"的反向验证,
# 防止 AI 在执行时跳过某个阶段 (如 Phase 1.13 Issue 感知) 却没人发现。
#
# 关键不变量: Phase 1.11 是硬编码执行的 (不像 Phase 1.13 需读 config 判断),
# 所以在这里放探针 = 利用可靠阶段监视不可靠阶段。

checks:
  # --- Issue 扫描新鲜度 (防止 Phase 1.13 被跳过) ---
  - name: "issue-cache-freshness"
    description: |
      若 issue_scan.enabled=true, 断言上一份 .aria/state-snapshot.json 内
      generated_at 与 issue_status.fetched_at 的差 (数据陈旧度) 在 2×cache_ttl 内。
      lag-1 语义: 求值时本次 snapshot 尚未写盘, 读到的是上一次 scan 的产物 (审计上一次,
      故障下一次 scan 才见)。只设上界 — 负 Δ (live fetch, fetched_at 晚于 scan 入口)
      是最健康信号, PASS。缺上一份/缺字段/坏 JSON → SKIP (可见, 非 PASS 非 FAIL)。
      (Spec C: state-scanner-issue-cache-freshness-assertion; 旧机制看 issues.json 文件
      mtime, 跨两次 scan 比较天然滞后而恒红 — 已废弃。)
    command: |
      python3 aria/skills/state-scanner/scripts/issue_cache_freshness_probe.py .
    severity: warning
    fix: "重跑 /state-scanner 触发 Phase 1.13 live fetch 刷新 issue_status.fetched_at; 持续 STALE 则核查 issue_scan 是否被跳过"
    timeout_seconds: 5
    enabled: true

  # --- silknode-integration-contract deferred-acceptance expiry ---
  - name: "silknode-contract-deferral-expiry"
    description: |
      Watches the silknode-integration-contract Spec waiver decision file.
      Per 2026-05-07 3-round Spec discussion loop convergence:
      - Spec archived 2026-05-07 with explicit waiver until 2026-08-05
      - Contract 2 (业务数据分类约束) was never mechanically enforced in M2
      - This probe is the "detection stub" deliverable from R3 convergence
        (closes qa-engineer R2 objection #c "scaffold-helpers-drift risk")
      WARN (not BLOCK) if expires_at past now() — waiver renewal / Spec
      re-evaluation required per .aria/decisions/2026-05-07-silknode-contract-*.
    command: |
      WAIVER='.aria/decisions/2026-05-07-silknode-contract-archive-with-deferred-acceptance.md'
      if [ ! -f "$WAIVER" ]; then
        echo "OK (waiver file absent — likely pre-2026-05-07 state)"; exit 0
      fi
      # 2026-08-08: waiver may reach a terminal status (owner 裁定拆分取代). Without
      # this branch the probe compares an expires_at that no longer governs anything
      # and is therefore PERMANENTLY red — zero information, same as a false green
      # (memory feedback_false_green_dual_is_permanent_red).
      # fail-CLOSED: only this explicit whitelist short-circuits; any other/unknown/
      # empty status falls through to the expires_at comparison below, and a terminal
      # status that fails to name a successor is reported MALFORMED rather than OK.
      STATUS=$(grep -E '^status:' "$WAIVER" | head -1 | sed -E 's/^status:[[:space:]]*//; s/[[:space:]]*$//')
      case "$STATUS" in
        superseded_by_split|closed|resolved)
          FM=$(awk 'NR==1 && /^---$/{next} /^---$/{exit} {print}' "$WAIVER")
          SUCC=$(printf '%s\n' "$FM" | grep -cE '^[[:space:]]*-[[:space:]]+https?://')
          if [ "${SUCC:-0}" -lt 1 ]; then
            echo "MALFORMED — status=$STATUS but no superseded_by URL in frontmatter of $WAIVER"; exit 1
          fi
          echo "OK (status=$STATUS, ${SUCC} successor ref(s) — see §2026-08-08 Closure)"; exit 0
          ;;
      esac
      EXPIRES=$(grep -E '^expires_at:' "$WAIVER" | head -1 | sed -E 's/^expires_at:[[:space:]]*//; s/T.*$//; s/[[:space:]]*$//')
      if [ -z "$EXPIRES" ]; then
        echo "MALFORMED — expires_at not found in $WAIVER"; exit 1
      fi
      EPOCH_EXPIRES=$(date -d "$EXPIRES" +%s 2>/dev/null)
      EPOCH_NOW=$(date +%s)
      if [ -z "$EPOCH_EXPIRES" ]; then
        echo "MALFORMED — expires_at '$EXPIRES' not parseable"; exit 1
      fi
      if [ "$EPOCH_NOW" -gt "$EPOCH_EXPIRES" ]; then
        DAYS_OVER=$(( (EPOCH_NOW - EPOCH_EXPIRES) / 86400 ))
        echo "EXPIRED — silknode-contract waiver past $EXPIRES (${DAYS_OVER}d over)"
        exit 1
      fi
      DAYS_LEFT=$(( (EPOCH_EXPIRES - EPOCH_NOW) / 86400 ))
      echo "OK (${DAYS_LEFT}d until waiver expiry $EXPIRES)"
    severity: warning
    fix: |
      1. Read .aria/decisions/2026-05-07-silknode-contract-archive-with-deferred-acceptance.md §重新评估时 SOP
      2. Check deferred acceptance items (c) US-025 status + (d) US-026/PRD anchor status
      3. Decide: close waiver (all MET) / renew waiver (new file, new expires_at) / upgrade to standards/governance/silknode-no-storage.md
    timeout_seconds: 5
    enabled: true

  # --- M6 Documentation Drift Probes (aria-2.0-m6-docs TG-DOCS-A, AD-M6-7) ---

  - name: "m6-version-badge-match"
    description: |
      Verify README.md Plugin badge version matches aria/.claude-plugin/plugin.json.
      Drift = README badge stale after a plugin version bump.
      Task dependency: this probe produces PASS only after T-A2.1 (README badge update).
      FAIL before T-A2.1 is expected and correct behavior.
    command: |
      BADGE=$(grep -m1 -oP 'badge[^\d]*v?\K[0-9]+\.[0-9]+\.[0-9]+' README.md)
      PLUGIN=$(python3 -c "import json; print(json.load(open('aria/.claude-plugin/plugin.json'))['version'])")
      [ -z "$BADGE" ] && { echo "MISSING badge pattern in README.md"; exit 1; }
      [ "$BADGE" = "$PLUGIN" ] && echo "OK badge=$BADGE" || { echo "DRIFT badge=$BADGE plugin=$PLUGIN"; exit 1; }
    severity: warning
    fix: "Update README.md Plugin badge to match aria/.claude-plugin/plugin.json version"
    timeout_seconds: 5
    enabled: true

  - name: "m6-claude-md-version"
    description: |
      Verify CLAUDE.md top-level version field is 2.0.0 after Aria 2.0 release.
      Drift = CLAUDE.md not yet updated after v2.0.0 ships, or accidentally reverted.
    command: |
      VER=$(grep -oP '(?<=\*\*版本\*\*: )[0-9]+\.[0-9]+\.[0-9]+' CLAUDE.md | head -1)
      [ "$VER" = "2.0.0" ] && echo "OK version=$VER" || { echo "DRIFT claude-md-version=$VER (expected 2.0.0)"; exit 1; }
    severity: warning
    fix: "Apply CLAUDE.md Diff 9 version bump: **版本**: 1.0.4 -> **版本**: 2.0.0"
    timeout_seconds: 5
    enabled: true

  - name: "m6-arch-doc-stale"
    description: |
      Warn if docs/architecture/system-architecture.md **Last Updated** header is >=90 days old.
      Architecture docs that age without review silently diverge from reality (post-M5 experience).
    command: |
      LAST=$(grep -oP '(?<=\*\*Last Updated\*\*: )\d{4}-\d{2}-\d{2}' docs/architecture/system-architecture.md | head -1)
      [ -z "$LAST" ] && { echo "MISSING Last Updated header"; exit 1; }
      python3 -c "
      import sys, datetime
      last = datetime.date.fromisoformat('$LAST')
      today = datetime.date.today()
      age = (today - last).days
      if age < 90:
          print(f'OK age={age}d')
          sys.exit(0)
      else:
          print(f'STALE age={age}d (threshold=90d)')
          sys.exit(1)
      " || exit 1
    severity: warning
    fix: "Update docs/architecture/system-architecture.md **Last Updated** header and review content"
    timeout_seconds: 5
    enabled: true

  # --- i18n README 正文滞后防再漂 backstop (Issue #140, B 档) ---
  - name: "i18n-readme-translation-currency"
    description: |
      防再漂 backstop (Issue #140, B 档): 比对每个 root i18n README 顶部的
      <!-- translated-from: vX.Y.Z --> 标记 vs aria/.claude-plugin/plugin.json 版本。
      标记 = 该翻译同步自哪个版本; 与当前 plugin 版本不一致 = 正文可能滞后。
      检测的是正文滞后 (非仅 badge) — #140 核心教训: badge 称最新但正文旧, 比旧 badge 更误导。
      WARN (非 BLOCK), 遵循 advisory-over-hardlock。文件缺失则跳过 (非所有项目有全语种)。
    command: |
      python3 - <<'PYEOF'
      import json, re, sys
      try:
          plugin = json.load(open("aria/.claude-plugin/plugin.json")).get("version", "")
      except Exception:
          plugin = ""
      stale, missing, ok = [], [], []
      for f in ["README.zh.md", "README.ja.md", "README.ko.md"]:
          try:
              text = open(f, encoding="utf-8").read()
          except FileNotFoundError:
              continue
          m = re.search(r"translated-from:\s*v?(\d+\.\d+\.\d+)", text)
          if not m:
              missing.append(f)
          elif m.group(1) == plugin:
              ok.append(f)
          else:
              stale.append(f + "@" + m.group(1))
      if not plugin:
          print("MALFORMED — plugin.json version unreadable"); sys.exit(1)
      if missing:
          print("MISSING marker: " + ", ".join(missing)); sys.exit(1)
      if stale:
          print("STALE vs plugin " + plugin + ": " + ", ".join(stale)); sys.exit(1)
      print("OK (" + str(len(ok)) + " i18n READMEs current @ " + plugin + ")" if ok else "OK (no i18n READMEs present)")
      PYEOF
    severity: warning
    fix: |
      root i18n README 正文滞后于 plugin 版本。以当前 README.md 为源重新同步滞后语种,
      并把各文件顶部 <!-- translated-from: vX.Y.Z --> 标记更新到当前版本。
      参考 openspec/archive/*-aria-i18n-readme-full-resync。
    timeout_seconds: 5
    enabled: true

  # --- block-flip 监控已退役 (2026-06-21): flip 已执行 (aria v1.49.0, warn→block).
  #     gate 默认 block, Spec 归档 openspec/archive/2026-06-21-aria-submodule-gate-block-flip.
  #     决策记录 .aria/decisions/2026-06-21-v1.49.0-block-flip.md。监控目的 (决定何时 flip) 已达成,
  #     check 移除。今后 gate 行为由 phase-c-integrator T-flip-12 测试 + tripwire host-cron 守护。 ---

  # --- CLAUDE.md 卫生: 禁 changelog/session 流水回涨 (claude-md-hygiene.md Option A) ---
  - name: "claude-md-changelog-free"
    description: |
      CLAUDE.md 卫生规范 (standards/conventions/claude-md-hygiene.md, Option A 彻底移交):
      CLAUDE.md 不得累积版本 changelog / session 流水 / skill 设计内部术语。footer 只放指针;
      时效内容归 docs/handoff/ (Rule #9) + CHANGELOG.md (SOT)。双预算 (行 200 + 字节 24000,
      2026-07-22): 行数对齐官方 memory 指南, 字节堵长行钻空。写入时刻纪律见规范 §2.4。
      本 check = 防"砍完又长回来"的根因兜底 (2026-07-03 首瘦 + 2026-07-22 二瘦)。
    command: |
      ROLL=$(grep -cE '^> 前次|^\*\*更新\*\*:|^\*\*最近更新\*\*:' CLAUDE.md 2>/dev/null)
      LINES=$(wc -l < CLAUDE.md)
      BYTES=$(wc -c < CLAUDE.md)
      if [ "${ROLL:-0}" -gt 0 ]; then
        echo "REGROWTH — footer 有 $ROLL 条滚动 changelog (Option A 禁止, 移交 docs/handoff/)"; exit 1
      fi
      if [ "$LINES" -gt 200 ]; then
        echo "BUDGET — CLAUDE.md $LINES 行 > 200 (官方 memory 指南目标; 疑 changelog/流水/skill 设计术语回涨, 核对时效内容是否该移交)"; exit 1
      fi
      if [ "$BYTES" -gt 24000 ]; then
        echo "BUDGET — CLAUDE.md $BYTES 字节 > 24000 (行数达标但单行爆表 = 长行钻空; 见 claude-md-hygiene.md §2.4)"; exit 1
      fi
      echo "OK (no rolling changelog; $LINES lines, $BYTES bytes)"
    severity: warning
    fix: |
      把 footer 滚动条目 / 内联版本 changelog 移交 docs/handoff/ (Rule #9) + CHANGELOG.md (SOT);
      项目状态段在 15-20 行内原地覆写非 append, 新事实先落 canonical 家、这里只放指针,
      skill 设计术语不入内 (污染 AB baseline, aria-plugin #116)。
      见 standards/conventions/claude-md-hygiene.md §2.3/§2.4 (Option A + 写入时刻纪律)。
    timeout_seconds: 5
    enabled: true

  # --- Layer L coordination gate 运行时活体探针 (防 run_gate 再退化死代码) ---
  - name: "coordination-gate-invocation"
    description: |
      若 state_scanner.coordination.enabled=true, 生产 telemetry 分区
      (.aria/coordination-telemetry.jsonl) 必须含 ≥1 条 **14 天内** 的
      source=production 记录 —— 证明 run_gate() 近期真经 CLI 生产入口被调
      (非死代码 / 非陈旧一次性记录)。TASK-012 runtime-invocation 探针
      (DEC-20260704-002; aria-plugin #95 修法示范)。
      **新鲜度窗口** (audit fix): append-only 分区不修剪, 故只计近 14d 记录,
      否则一条历史记录会让探针永久假绿、检不出事后再退化 (对齐
      issue-cache-freshness 现在时语义)。**只读生产分区**: public API
      (run_gate 无 source 参 / run_gate_synthetic 强制 harness) 结构上无法写
      生产分区; 仅 CLI _main 经私有 _gated(_source=production) 可写。gate
      关闭时探针恒 OK。
    command: |
      python3 aria/skills/state-scanner/scripts/coordination_probe.py .
    severity: warning
    fix: |
      确认 coordination.enabled=true 后, dogfood 一次 (TASK-019) 或在近 14d 内
      经 CLI 生产入口真调 run_gate(); STALE 意味机制虽接线但近期未被调用 (退化风险)。
    timeout_seconds: 5
    enabled: true

  # --- 运行时 plugin 版本 vs 仓内 SOT (Aria #172: "ship 了" ≠ "本仓用上了") ---
  - name: "config-template-key-currency"
    description: |
      Aria #181 机械兜底: 断言 .aria/config.template.json 的 phase_c_integrator.
      pre_merge_gate 段 (a) 经 _normalize_config 零 DeprecationWarning — 模板分发
      弃用键 = 把 deprecation 警告直接发给新采用方; (b) 全部键 ∈ DEFAULT_CONFIG ∪
      {_comment} — 代码改键名而模板没跟时, 在 alias 存在前就先红。本类缺陷本仓 live
      config 恒 0 命中 (受影响的全是仓外采用方), dogfood 发现不了, 只能机械看模板。
      作用域 = 仅 pre_merge_gate 段 (事故发生段 + 仓内唯一有 DEFAULT_CONFIG 注册表
      可比对的段; 其他段无 schema 注册表, 全模板断言不可 fail-closed 实现)。
      判据分割: 模板/段/导入缺失 → SKIP (零证据不当正证据); 弃用键或未知键 → FAIL。
      拒绝能力已验: 旧键合成模板 FAIL (2 warning + 2 unknown) / 漂移键合成模板 FAIL。
    command: |
      python3 .aria/probes/config-template-key-currency.py
    severity: warning
    fix: |
      模板键落后代码: 把 .aria/config.template.json 中被点名的键改为 FAIL 文案里
      DeprecationWarning 指出的新键名 (值语义对照 pre_merge_gate._translate_value),
      并在段 _comment 里补一句退役说明 (体例见 sync_check 段 _comment 的 F2′ 先例)。
      未知键: 对照 pre_merge_gate.DEFAULT_CONFIG 勘正拼写或删除。参考 Aria #181。
    timeout_seconds: 10
    enabled: true

  - name: "plugin-cache-currency"
    description: |
      比对 Claude Code 实际加载的 aria-plugin 版本 (installed_plugins.json 记录,
      多条取最旧) 与仓内版本 SOT (aria/.claude-plugin/plugin.json)。
      Aria #172 实测: cache 停在 1.63.0 而 SOT 已 1.65.5 ⇒ v1.64/v1.65 的全部
      hook 修复在 Aria 自己的运行时从未生效 ⇒ **仓内一切 hook/skill dogfood 验收
      失真** (测到的是旧副本)。与 memory feedback_release_phase_d_5_files_
      synchronization 同族, 只是这次"用户"是我们自己。
      滞后有两层, 本探针检其**后果**故两层任一断裂都红, 并在 STALE 文案里回报
      marketplace clone 自称版本以分辨该刷 marketplace 还是直接装。
      判据全分割: SOT 缺失 / 无安装记录 → SKIP (零证据不当正证据);
      版本串不可解析 → FAIL (fail-closed); < SOT → STALE; == → PASS; > → AHEAD。
    command: |
      python3 .aria/probes/plugin-cache-currency.py
    severity: warning
    fix: |
      STALE 第 1 层 (marketplace 也旧): 依次跑 `/plugin marketplace update 10CG-aria-plugin`
      再 `/plugin update aria@10CG-aria-plugin`; 第 2 层只需后者。装完**重启 session** 使新
      副本生效, 并复验 `nomad var put p @f` 得 exit=2 (aria-plugin #170 的修复现场)。
      AHEAD: 本地 aria/ 子模块 checkout 陈旧 —— `git submodule update --remote aria`。
    timeout_seconds: 5
    enabled: true
