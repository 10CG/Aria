  verification:
  - 'SC-M6: 受控裸仓远端只有 refs/heads/wip/master 时传 master ⇒ fail + kind=main-branch-not-found'
  - 'SC-M13: 传 ''mast*'' / ''m[a]ster'' / ''maste?'' 三个 glob 形态 ⇒ 全部 fail (锚定 pattern 实现必须在此 RED)'
  - 判据固定为「返回 ref 名列表中存在 == 'refs/heads/' + main_branch 的精确匹配」, spike 只决定取列表方式
  - '零命中用例 (必须单列): 受控裸仓远端只有 refs/heads/master, 传 --main-branch develop ⇒ 须得
    kind=="main-branch-not-found"。⚠️ SC-M6 与 SC-M13 的场景都有命中, 结构上碰不到这条分支,
    不能靠它们代管; 用 --exit-code 的实现在此必红。'
  notes: '本条是 R2 承重 Critical 的真正闭合腿。前两次修法都不够: 裸分支名 → 尾段 glob 误匹配 (wip/master 被当 master); 锚定 refs/heads/<name> → 只关掉尾段那半, name 含 glob 元字符时仍全返 RC=0 (受控实验实测)。

    🔴 2026-08-10 受控裸仓补测出两条更底层的事实, 六轮审计从未浮出: (a) ls-remote 零命中亦返 rc=0 (传 refs/heads/wibble ⇒ rc=0 + 零行输出) ⇒ 判据必须落在解析出的 ref 名列表上, 不得读退出码 — 以退出码判存在性的实现对「分支不存在」这个本 Spec 的主场景天然 fail-OPEN; (b) ⛔ 不得用 --exit-code — 实测无命中返 rc=2, 会被 proposal §5 的 catch-all 误分类成 main-branch-verify-failed 而非 main-branch-not-found。这是实现者最可能选的「更简单」替代路径, 故在 Spec 层直接写死排除, 不让实现者先走进去再被测试弹回来。'
- id: TASK-004
  parent: '0.4'
  task_group: TG-0
  title: 异常与重试的复用形态 — 主干已裁 (D-4), 抽共享重试 helper + 四条缺口
  status: pending
  complexity: M
  est_hours: 5
  agent: backend-architect
  dependencies:
  - TASK-001
  deliverables:
  - aria/skills/phase-c-integrator/scripts/ci_backends/aether.py
  - aria/skills/phase-c-integrator/tests/test_ci_backends.py
  - spike 结论回写 proposal.md §5 退出码表
  verification:
  - 'SC-M7: 非零非 2 退出码 (实测 remote 名不存在/坏 URL/网络不可达均为 128, 用法错误 129) ⇒ fail + kind=main-branch-verify-failed, 未重试'
  - 'SC-M8: TimeoutExpired ⇒ 按 SKILL.md:259 重试后 fail; 测试须 mock time.sleep, 耗时 >60s 视为红'
  - 'catch-all 分支存在: 任何未枚举情形 (FileNotFoundError / OSError / UnicodeDecodeError / 输出不可解析) 一律 fail, 不得放行'
  - '复用是**按轴分派的两个先例, 不是三选一** (⚠️ 把 A/B/C 框成单选是误框, 已更正): 异常轴 ←
    path_coverage.py:93 的 (TimeoutExpired, FileNotFoundError, OSError) 三元组**枚举**; 重试轴 ←
    aether.py:38 RETRY_BACKOFF=(5,15,45) + :164-187 _run_with_retry。被否决的只有「调
    path_coverage._run_git() 函数本身」这一种读法, 那条 except 元组的枚举仍是异常轴唯一成文先例。'
  - '缺口 1 — _run_with_retry 结构上交付不出 §5 的 catch-all: :168 docstring 逐字「other exceptions
    bubble up」, :180 只 except TimeoutExpired ⇒ gate 层仍必须自建异常包裹层, 重试 helper 不代管这层。'
  - '缺口 2 — 解码轴: aether.py:176 用 text=True, 而 gate 要跑的是 git ls-remote 且 git 不保证 ref 名
    是合法 UTF-8 ⇒ UnicodeDecodeError 不是 TimeoutExpired, 不被捕, 违反 §5。同包 path_coverage.py:78-84
    正是为此写 bytes + surrogateescape (#124) ⇒ 共享 helper 至少要多出 decode 策略与 timeout 两个参数。'
  - '缺口 3 — cwd 承重而 _run_with_retry 无该参数 (_run_git 有): D3 + §5「同一个 cwd」使「ls-remote 跑在
    哪个仓」承重 — 主仓与 aria 子模块都有 master, 查错仓即假通过 ⇒ 共享 helper 须显式接 cwd。'
  - '缺口 4 — 超时哨兵 aether.py:187 return -1 与信号致死的 -1 (SIGHUP) 别名, 而 D7 要求 gate
    「退出码分区自带完整表」⇒ gate 不得把 helper 的 -1 直接当退出码读, 须有可区分的 timeout 信号。'
  - '**等价判据 (本版换量)**: 须新建**针对 _run_with_retry 本身**的直接用例 — (a) 只有 TimeoutExpired
    触发重试、其余异常照旧 bubble up; (b) backoff 5/15/45 × 3 attempts (mock time.sleep); (c) 超时哨兵
    与真实退出码可区分。'
  notes: '在一份治「同一算法两份实现」的 Spec 里再造第二份重试实现是自相矛盾 (R5 两席命中)。 本条的产出若是「新写一份」, 必须显式论证为何不能复用。

    🔴 「test_ci_backends.py 25 tests 保持全绿」**是恒绿判据, 不得当等价证据**: 实测 grep -c ''_run_with_retry'' tests/test_ci_backends.py = 0, 那 25 条系统性绕过它 (改 mock subprocess.run 或 _query), 其**异常选择行为零覆盖** ⇒ 抽取时把 except TimeoutExpired 放宽成三元组 (为服务 gate 的 catch-all, 这是最自然的写法) 会静默改掉 aether 的异常契约而 25 条全绿。25 tests 全绿只能当**必要不充分**条件。

    ⚠️ 本条上一版标题写「spike」且 complexity=S/3h — 四条缺口浮出后已上调为 M/5h, 且 deliverables 补入 aether.py 与 test_ci_backends.py。'
