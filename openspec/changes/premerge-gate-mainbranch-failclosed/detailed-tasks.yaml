    ⚠️ 2026-08-11 更正 (post_planning R2/code-reviewer): 上一版本字段逐字写「不再是条件触发」,
    与本文件 TASK-020 的 title/末条 verification 及 tasks.md 的「条件性不得抹掉」**直接矛盾** —
    ship_target 是 AI 依 owner 授权作出的裁定且三份文件都要求写入 handoff 请复议, 复议若改档为
    MINOR, 读本字段的执行者会保留 TASK-020 而读 TASK-020 的执行者会 cancel 它 (两个独立执行者对
