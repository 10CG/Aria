    本条是**输入**不是结论: 若 spike 判定不沿用该先例, 须显式写出理由。'
  - '⚠️ 行号锚 (:242 / :610 SKILL.md · :60-62 submodule-gate-telemetry.sh) 以基线 SHA 为准, 按内容锚重定位 — 见 metadata.line_anchor_convention'
  notes: '⛔ 两个已被实测否决的形态都不得沿用。

