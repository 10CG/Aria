    🔴 2026-08-10 受控裸仓补测出两条更底层的事实, 六轮审计从未浮出: (a) ls-remote 零命中亦返 rc=0 (传 refs/heads/wibble ⇒ rc=0 + 零行输出) ⇒ 判据必须落在解析出的 ref 名列表上, 不得读退出码 — 以退出码判存在性的实现对「分支不存在」这个本 Spec 的主场景天然 fail-OPEN; (b) ⛔ 不得用 --exit-code — 实测无命中返 rc=2, 会被 proposal §5 的 catch-all 误分类成 main-branch-verify-failed 而非 main-branch-not-found。这是实现者最可能选的「更简单」替代路径, 故在 Spec 层直接写死排除, 不让实现者先走进去再被测试弹回来。'
