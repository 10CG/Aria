- id: TASK-002
  parent: '0.2'
  task_group: TG-0
  title: spike — helper 路径解析形态 (先定锚点; 五种 cwd 全可达)
  status: pending
  complexity: M
  est_hours: 4
  agent: backend-architect
  dependencies:
  - TASK-001
  deliverables:
  - spike 结论回写 openspec/changes/premerge-gate-mainbranch-failclosed/proposal.md §1
  verification:
  - 'SC-M12: 五种 cwd 全部可达 — 主仓根 / aria 子模块根 / standards 子模块根 /
    aria-orchestrator 子模块根 / 采用方仓根 (有 .aria/、无 aria/ 无 skills/, 插件装在仓外)'
  - 不可达时 abort (不得放行), 但健康常态下不得 abort — 两个方向都要有用例
  - '先定锚点再定机制: :610 逐字「路径相对项目根」 vs :242 逐字「目标仓根」是两个互斥锚点,
    而两个变量都 unset 时 ${VAR:-aria} 的回落把二者压成同一个相对路径 ⇒ 换变量名治不到病灶。
    spike 须先在「项目根 / 目标仓根 / 仓外安装根」里定锚点 (或给出显式优先序)。'
  - '变量归属 (ARIA_ vs CLAUDE_) 是本 spike 的**产出**不是输入 — proposal 与 tasks.md 均不预先
    定死, TASK-014 依赖本条, 依赖方向不可反 (⚠️ 上一版此处写「方向需 owner 裁」, 已改口)'
  - '⚠️ :242 的作用域限于步骤 2.5「Path coverage 评估」(实读: 该句讲 evaluate_path_coverage()
    的调用上下文), 不是 C.2 合并全流程契约。引用它必须带这个限定 — 本项目对 :242 的误引已有前科。'
  notes: '⛔ 两个已被实测否决的形态都不得沿用。

    (a) R4-fix 版的两分支 git rev-parse 形态 — R5 四席实测在 standards/aria-orchestrator 子模块根与 plugin 安装态下全不可达 ⇒ 恒红。

    (b) 「cwd 相对多候选探测为主路径 + 把 CLAUDE_PLUGIN_ROOT 降为非承重可选覆盖」— 2026-08-10 对抗复核实测否决: /home/dev/Kairos 与 /home/dev/SilkNode 两个真实采用方都有 .aria/ 而没有 aria/ 与 skills/, helper 实际在仓外 ~/.claude/plugins/marketplaces/10CG-aria-plugin/skills/phase-c-integrator/scripts/ ⇒ 任何 cwd 相对候选结构上都够不到它; CLAUDE_PLUGIN_ROOT 是目前唯一能指向仓外安装根的机制, 降级它 = 原样重犯 (a) 的恒红。

    ⚠️ 上一版给的 spike 输入已被证伪三条并更正: (a)「:262/:559/:610 用 CLAUDE_PLUGIN_ROOT」实为 ARIA_ (方向相反); (b)「3 个副本位置」把同一 inode 数了两次又漏了三份 cache — find 得 5 条路径; (c)「全仓 CLAUDE_ 66 处 / ARIA_ 5 处」是混口径 — 66 是 occurrence 数、5 是行数, 没有任何单一计数法能同时给出这一对。统一口径 (总体=aria 子模块, 范围=git-tracked): 按行数 CLAUDE_ 65 / ARIA_ 5; 按 occurrence CLAUDE_ 66 / ARIA_ 7。详见 proposal §1 表。

    ⚠️ 「模拟 plugin 安装态」措辞已作废 — 它曾被取成 cwd = marketplace 目录本身 (候选 1 直接命中), 是假绿且不对称的 fixture; 真形态是「cwd = 采用方仓根, 插件在仓外」。'
- id: TASK-003
  parent: '0.3'
  task_group: TG-0
  title: spike — 存在性核验的精确比对实现
  status: pending
