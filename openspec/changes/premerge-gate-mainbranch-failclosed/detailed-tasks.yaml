    ⚠️ 上一版给的 spike 输入已被证伪三条并更正: (a)「:262/:559/:610 用 CLAUDE_PLUGIN_ROOT」实为 ARIA_ (方向相反); (b)「3 个副本位置」把同一 inode 数了两次又漏了三份 cache — find 得 5 条路径; (c)「全仓 CLAUDE_ 66 处 / ARIA_ 5 处」是混口径 — 66 是 occurrence 数、5 是行数, 没有任何单一计数法能同时给出这一对。统一口径 (总体=aria 子模块, 范围=git-tracked): 按行数 CLAUDE_ 65 / ARIA_ 5; 按 occurrence CLAUDE_ 66 / ARIA_ 7。详见 proposal §1 表。

    ⚠️ 「模拟 plugin 安装态」措辞已作废 — 它曾被取成 cwd = marketplace 目录本身 (候选 1 直接命中), 是假绿且不对称的 fixture; 真形态是「cwd = 采用方仓根, 插件在仓外」。'
