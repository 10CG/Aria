    得不到线索, 存在重新发明一套探测逻辑的风险; 与本 Spec 对异常/重试轴那条「再造第二份必须显式论证为何
    不能复用」的强制要求不对称): aria/hooks/submodule-gate-telemetry.sh:60-62 实读 =
    「${CLAUDE_PLUGIN_ROOT:-} 优先 → 不中则自定位 → 仍不中即 exit 0 (fail-closed)」。
    ⚠️ **可移植的是这个结构** (显式优先序 + 不中即收口), **不是 BASH_SOURCE 本身** — hook 是脚本
    自己定位自己, 而 C.2.4 是 AI 照 SKILL.md 敲一条命令, 敲之前没有 BASH_SOURCE。
