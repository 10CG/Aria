  execution_order_sot: '🔴 **执行顺序的唯一 SOT = 本文件各 task 的 `dependencies` (DAG), 不是 `task_group`
    编号, 也不是 tasks.md 的组标题顺序** (2026-08-12 补, post_planning R3/tech-lead 实测**组号与 DAG
    方向 7 处倒置**, 而 tasks.md 的组标题逐字承诺了组序 ⇒ 两条编排面互相矛盾, 执行方按哪条都会撞)。
    本轮已把两条真正错组的任务归位: TASK-005 TG-0→TG-1 (它依赖 TG-1 的 TASK-010, 结构上不是 TDD 前置) ·
    TASK-021 TG-1→TG-3 (它依赖 TG-2 的 011/012/013/014 与 TG-3 的 020)。归位后**仅剩一处**方向不一致:
    TASK-015(TG-3) 依赖 TASK-019(TG-4) — **有理由且已成文**: Rule #6 判据表第三行三件套要求「套件缺口
    issue 必须**先于**归档存在, 不能事后补票」, 而主题分区上开 issue 属 follow-up 组 ⇒ 主题与执行序
    在此天然正交。机械判据 (xcheck.py CHECK6): task_group 编号 < 某依赖的 task_group 编号 ⇒ 红,
    **除非**该任务文本内写有指名该依赖的理由。
    ⚠️ 「组 0 必须先做」这条方法论要求**由 DAG 本身保证而非组号**: 实跑确认 TASK-001 是其余 20 条
    **全部**的传递祖先。'
  evaluation_time_convention: '🔴 **全局** (2026-08-12 补 — post_planning R2/tech-lead 原始处方逐字是
    「统一补**一条规则**」, 而 R2-fix 只改了 TASK-004/006/007 三个**实例**, 该类随即在 R2-fix 自己新写的
    TASK-015 blob-SHA 条款与 TASK-008/SC-M6 上原样复发; memory fix-the-class + fix-recurs-in-fallback):
    **任一 task 的每条 verification 必须在「该 task 完成的那一刻」可求值。**
    三条派生规则: (1) 若某条 SC 的期望值需要**下游任务**的交付物才可能成立 ⇒ 该 SC 必须**按半边拆分认领**
    (本任务认领自己交付得出的那半, 另半移交下游并在下游 verification 里点名), 不得整条挂在上游;
    (2) 若某条断言的比较对象在 Phase B 内根本不存在 (典型: 「与 Phase C 落地时的 X 相等」) ⇒ 必须拆成
    「Phase B 可求值的那半」+「明确标注移交 Phase C 的那半」, 后者**不计入本任务完成判据**;
    (3) 凡 verification 里点名其他 TASK 作为移交对象, DAG 上必须存在**方向正确**的依赖边
    (被依赖者先行 / 移交给下游者后行), 机械判据见 xcheck.py CHECK1。'
  line_anchor_convention: '🔴 **全局** (2026-08-11 补, post_planning R2 诊断的「只修实例不修类」):
    本文件与 tasks.md 内的一切 `:NNN` 行号一律**以基线 SHA 为准** (aria = af87cae, 主仓 = 7582238),
    它们是**定位辅助, 不是验收量**。本 change 会改动的文件 — phase-c-integrator/SKILL.md ·
    scripts/pre_merge_gate.py · scripts/ci_backends/aether.py · tests/test_pre_merge_gate.py ·
    tests/test_ci_backends.py · config-loader/SKILL.md · .aria/config.template.json — 其行号在**任何
    排在改动之后的任务**求值时都可能已位移 (最重的是 TASK-011 改动 SKILL.md :99-:216 与 :218 起两段
    ⇒ :218+ 全部前后移)。⇒ **所有验收一律按内容锚重定位, 不得按行号核**; 凡本文件某条 verification
    出现行号锚, 该 task 须自带一句指回本约定的护栏 (机械可查)。
    ⚠️ R1-fix 轮只给 TASK-014 写了这条护栏 (R1/M3 同时点名 012/013/014), R2 三席各自又抓到新实例
    (TASK-012/013/020) — 那正是 memory fix-the-class 的形状: 修实例必问「这形状还有几个兄弟位置」。'
  ship_target: 'MAJOR — 2026-08-10 依 owner 授权裁定确认, 不再是「待确认」(Rule #10 留痕: 该裁定由
    AI 作出, 须写入 handoff 请复议)。定档依据: CLAUDE.md:35「破坏性变更须 MAJOR」与 :79「MINOR+」
    两条下界求交唯一解。破坏面承重腿已换 — 上一版的「24 处 gate_check( 调用 TypeError」实测全部
