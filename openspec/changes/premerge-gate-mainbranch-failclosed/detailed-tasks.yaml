    「只修实例不修类」与「移交给没核过的下游」两个形状; ⇒ R2-fix 由**非 R2 席位**的执笔方完成
    (修上一轮「R1-fix 执笔方 tech-lead 同时是 R2 席位」的结构性冲突), 且 fix 后跑了一道机械的条款间
    交叉检查 (xcheck.py 四项)。
    🔴 **post_planning R3 已跑完 (2026-08-12, 5 席: 4 REVISE / 1 PASS, 原始 2C+17M+8m=27,
    10 条 blocks_phase_b, converged=false, fix 引入占比 70% — 回升)。R3 把那道机械交叉检查本身送上
    审判席并证伪了它**: tech-lead 在副本上做 5 个对抗构造, **4 个被放行** (边反向仍 PASS — CHECK1
    判据 `n in ANC[tid] or tid in ANC[n]` 是**无向**的, 而 R2 那两条 Major 全是**方向性**错误;
    明令「按行号逐字核」的句子因含「内容锚」三字而 PASS — CHECK3 验的是**词是否出现**不是性质;
    删掉真 owner 的 verification 仍 PASS — CHECK2 把**作废/否定语境**的提及算作 owner;
    新造插入点冲突仍 PASS — CHECK4 前半段**零断言**、后半段 9 条硬编码串**抄自产生它的那次 fix**
    ⇒ 相对该 fix 是**重言式**)。qa-engineer 与 backend-architect 用各自的隔离副本变异独立复现同一结论。
    ⇒ **本字段不得再被读成「R2 诊断的两个失效形状已被机械杜绝」** — 那道检查当时报的 FAIL 是真的
    (缺边/缺护栏确实缺), 但那是**一次性补齐**, 之后它是一道恒绿闸门。根因: 它是**无向存在性**检查,
    而失效是**方向性**与**类推广性**的 (memory invariant-dimension 逐字预言了这个结果)。
    🔴 **R3-fix (2026-08-12) 由不在 R3 五席名单内的执笔方完成, 且对 xcheck.py 本身做了四项改造 +
    补两项同族检查 (SC 表今日实测回源 / task_group↔DAG 方向), 每项均以「好实现 PASS + 坏实现 FAIL」
    的对抗 fixture 验过拒绝能力 — 不接受只贴当前取值 PASS。**'
  spec_authoring_note: '本 Spec 的实现细节凡编排层无法验证者一律降为 spike (TASK-002/003/004), 不在 proposal 层规定。 依据: post_spec 五轮实测编排层每轮 fix 引入 73-100% 新 Major, 总量五轮持平。 Spec 负责钉「什么算对」(SC), 不负责钉「怎么写」。spike 结论回写 proposal, 不在本文件另立规定。

    '
