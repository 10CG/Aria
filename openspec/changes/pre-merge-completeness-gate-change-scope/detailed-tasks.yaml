  v2_state_runs:
    what: v2 新增的 N4 / C1 (cell_status) / N6 (coord_ref_precheck) / N7 (crlf_guard) / N8 / N9 (commit_attribution) / N10 (guard_config_hooks) 在同一 scratch 主仓副本与临时仓上实跑; 代码取自本文件对应键, 副本外零写入 (N6 的远端是临时裸仓)
    command: python3 -B a2_v2_checks.py <scratch 主仓副本根> <scratch 工作目录> <本文件>  (脚本全文见 script; 下方 output 由该命令重生成, 未手改)
    script: |
      #!/usr/bin/env python3
      """v2 state runs for pre-merge-completeness-gate-change-scope: N4 / C1 / N6 / N7 / N8 / N9 / N10.

      usage: python3 -B a2_v2_checks.py <scratch main-repo clone> <work dir> <detailed-tasks.yaml>
      The clone is the same throwaway copy used by a2_state_runs.py (main repo a563192 + aria
      1cb3872 nested clone). Check code is taken from the yaml (metadata.*.code), so the yaml
      text is what gets exercised. The clone is restored at the end; <work dir> is wiped first.
      Output carries no paths, times or SHAs.
      N6 的本轨 claim 由脚本在临时仓自造 (raw id 每跑唯一, 容器身份由 phase1_gate 自解析), 不依赖
      执笔容器是谁, 也不依赖真仓此刻的认领状态; N9 的提交时间钉死并单调递增, git log 顺序唯一。
      """
      import json, os, re, shutil, subprocess, sys, time, uuid
      from pathlib import Path
      import yaml

      ROOT, WORK, YAML = Path(sys.argv[1]).resolve(), Path(sys.argv[2]).resolve(), Path(sys.argv[3]).resolve()
      ARIA = ROOT / "aria"
      SS = ARIA / "skills/state-scanner/scripts"
      M = yaml.safe_load(YAML.read_text(encoding="utf-8"))["metadata"]
      shutil.rmtree(WORK, ignore_errors=True)
      WORK.mkdir(parents=True)


      def run(cmd, cwd=None, check=True, env=None):
          p = subprocess.run(cmd, cwd=cwd, capture_output=True, text=True,
                             env=({**os.environ, **env} if env else None))
          if check and p.returncode != 0:
              raise RuntimeError(f"{cmd[:3]} rc={p.returncode}: {p.stderr[-300:]}")
          return p


      ns = {}
      exec(M["new_checks"]["code"], ns)  # n1..n4, n8
      CANON = M["canonical_call"].rstrip("\n").split("\n")


      def n4_block():
          print("== N4 (call string: SKILL.md bash blocks vs execution-modes.md Step 4 region vs canonical) ==")
          prop = (ROOT / "openspec/changes/pre-merge-completeness-gate-change-scope/proposal.md").read_text(encoding="utf-8").split("\n")
          print(f"[canonical == proposal :77-80] {prop[76:80] == CANON}")
          sk = (ARIA / "skills/audit-engine/SKILL.md").read_text(encoding="utf-8")
          em = (ARIA / "skills/audit-engine/references/execution-modes.md").read_text(encoding="utf-8")

          def sk_with(lines, fence=True):
              L = sk.split("\n")
              i = next(k for k, l in enumerate(L) if "scripts/sibling_spec_probe.py" in l and L[k - 1].startswith("```bash"))
              add = ["", "```bash", *lines, "```"] if fence else ["", "调用: " + " ".join(lines)]
              L[i + 2:i + 2] = add
              return "\n".join(L)

          def em_with(lines, where="step4", indent="    "):
              L = em.split("\n")
              anchor = r"\s*Step 4:" if where == "step4" else r"\s*Step 5:"
              i = next(k for k, l in enumerate(L) if re.match(anchor, l))
              L[i + 1:i + 1] = [indent + l for l in lines]
              return "\n".join(L)

          swapped = [CANON[0], CANON[2], CANON[1], CANON[3]]
          states = [
              ("baseline (1cb3872)", sk, em),
              ("target (SKILL top-level, EM indented 4)", sk_with(CANON), em_with(CANON)),
              ("target (EM indented 6)", sk_with(CANON), em_with(CANON, indent="      ")),
              ("bad: EM continuation lines swapped", sk_with(CANON), em_with(swapped)),
              ("bad: both sides swapped identically", sk_with(swapped), em_with(swapped)),
              ("bad: EM call after Step 5", sk_with(CANON), em_with(CANON, where="step5")),
              ("bad: SKILL call only in prose", sk_with(CANON, fence=False), em_with(CANON)),
              ("bad: EM call last line dropped", sk_with(CANON), em_with(CANON[:3])),
          ]
          for name, a, b in states:
              print(f"[{name}] N4={ns['n4'](a, b, CANON)}")


      def c1_block():
          print("== C1 (stage cells: each listed cell executed exactly once and passed) ==")
          d = WORK / "c1"
          d.mkdir()
          (d / "cell_status.py").write_text(M["stage_cells"]["code"], encoding="utf-8")
          body = {
              "target": "with self.subTest(cell='X.1'):\n            self.assertTrue(True)\n        with self.subTest(cell='X.2'):\n            self.assertTrue(False)\n",
              "bad_listed_cell_fails": "with self.subTest(cell='X.1'):\n            self.assertTrue(False)\n",
              "bad_method_errors_before_cell": "raise RuntimeError('fixture')\n        with self.subTest(cell='X.1'):\n            self.assertTrue(True)\n",
              "bad_cell_runs_twice": "for _ in range(2):\n            with self.subTest(cell='X.1'):\n                self.assertTrue(True)\n",
              "bad_cell_renamed": "with self.subTest(cell='X.1b'):\n            self.assertTrue(True)\n",
          }
          for name, b in body.items():
              (d / "test_cells_demo.py").write_text(
                  "import unittest\n\nclass T(unittest.TestCase):\n    def test_m(self):\n        " + b, encoding="utf-8")
              p = run([sys.executable, "-B", "cell_status.py", "test_cells_demo", "X.1"], cwd=d, check=False)
              print(f"[{name}] exit={p.returncode} {p.stdout.strip()}")
              shutil.rmtree(d / "__pycache__", ignore_errors=True)


      def n6_block():
          print("== N6 (coordination ref precheck before heartbeat push / forced alignment) ==")
          d = WORK / "n6"
          d.mkdir()
          bare, local, other = d / "remote.git", d / "local", d / "other"
          run(["git", "init", "-q", "--bare", str(bare)])
          run(["git", "-C", str(bare), "fetch", "-q", "/home/dev/Aria", "refs/aria/coordination:refs/aria/coordination"])
          seed = d / "seed"
          run(["git", "init", "-q", "-b", "master", str(seed)])
          (seed / "README").write_text("x\n")
          run(["git", "-C", str(seed), "add", "README"])
          run(["git", "-C", str(seed), "-c", "user.email=a@b", "-c", "user.name=a", "commit", "-q", "-m", "seed"])
          run(["git", "-C", str(seed), "push", "-q", str(bare), "master"])
          for c in (local, other):
              run(["git", "clone", "-q", str(bare), str(c)])
              run(["git", "-C", str(c), "fetch", "-q", "origin", "refs/aria/coordination:refs/aria/coordination"])
          (d / "precheck.py").write_text(M["coord_ref_precheck"]["code"], encoding="utf-8")
          # 本轨 claim 由 fixture 在临时仓自造, 等价于 TASK-001 在真仓读到的那一条: raw id 每跑唯一
          # (不与 seed 进来的真仓 claim 同 track), 容器身份由 phase1_gate 自解析后回填 own_claim。
          raw = "zz-precheck-own-" + uuid.uuid4().hex[:8]

          def pre(name):
              p = run([sys.executable, "-B", str(d / "precheck.py"), *sorted(own)], cwd=local, check=False)
              o = json.loads(p.stdout)
              kinds = [a["kind"] for a in o.get("ahead", [])]
              print(f"[{name}] exit={p.returncode} verdict={o['verdict']} local_ahead={o.get('local_ahead')} kinds={kinds}")

          def gate(repo, *args):
              return run([sys.executable, "-B", *args, "--repo-path", str(repo)], cwd=repo, check=False)

          acq = json.loads(gate(local, str(SS / "phase1_gate.py"), "--raw-track-id", raw,
                                "--phase", "B", "--mode", "advisory", "--no-push").stdout)
          oc = acq["own_claim"]
          own = {f"claims/{oc['container']}/{oc['session']}.yaml"}  # write_claim 的 file-per-writer 布局
          run(["git", "-C", str(local), "push", "-q", "origin", "refs/aria/coordination:refs/aria/coordination"])
          run(["git", "-C", str(other), "fetch", "-q", "origin", "+refs/aria/coordination:refs/aria/coordination"])
          print(f"    fixture own claim: acquire outcome={acq.get('outcome')} own_files={len(own)}")
          t0 = int(time.time())
          while int(time.time()) <= t0:  # heartbeat_at 精度到秒: 同秒刷新写出的是空 diff commit, 会判 other
              time.sleep(0.05)
          pre("equal")
          h = gate(local, str(SS / "phase1_gate.py"), "--heartbeat-only", "--raw-track-id", raw, "--phase", "B", "--no-push")
          print(f"    heartbeat outcome={json.loads(h.stdout).get('outcome')}")
          pre("local ahead: own heartbeat only")
          g = gate(other, str(SS / "phase1_gate.py"), "--raw-track-id", "zz-precheck-remote-other", "--phase", "A.1", "--mode", "advisory")
          print(f"    other clone acquire+push: push_success={json.loads(g.stdout).get('push_success')}")
          pre("remote advanced + local own heartbeat (diverged)")
          a = gate(local, str(SS / "phase1_gate.py"), "--raw-track-id", "zz-precheck-new-claim", "--phase", "A.1", "--mode", "advisory", "--no-push")
          print(f"    local acquire (no-push): outcome={json.loads(a.stdout).get('outcome')}")
          pre("local ahead: + new claim (acquire, unpushed)")
          run(["git", "-C", str(local), "fetch", "-q", "origin", "+refs/aria/coordination:refs/aria/coordination"])
          pre("after forced alignment")
          r = gate(local, str(SS / "release_gate.py"), "--raw-track-id", raw, "--status", "done", "--no-push")
          print(f"    local release (no-push): rc={r.returncode}")
          pre("local ahead: own release (unpushed)")


      def n7_block():
          print("== N7 (CRLF guard on phase-c-integrator/SKILL.md; frontmatter with and without tr -d CR) ==")
          rel = "skills/phase-c-integrator/SKILL.md"
          f = ARIA / rel
          base = f.read_bytes()
          guard_ns = {}
          exec(M["crlf_guard"]["code"], guard_ns)

          def fm(data, strip_cr):
              src = data.replace(b"\r", b"") if strip_cr else data
              p = subprocess.run(["awk", 'NR==1&&$0=="---"{f=1;next} f&&$0=="---"{exit} f'], input=src, capture_output=True)
              return p.stdout

          L = base.split(b"\r\n")
          i57 = next(k for k, l in enumerate(L) if "C.2 合并前触发 audit-engine".encode() in l)
          good = L[:]
          good[i57] = "当 `audit.enabled=true` 且 pre_merge 按 C.2 pre_hook 步骤 3 的优先级链判为启用时，C.2 合并前触发 audit-engine (pre_merge 检查点)。".encode()
          desc = next(k for k, l in enumerate(L) if l.startswith(b"description:"))
          bad_desc = L[:]
          bad_desc[desc + 1] = bad_desc[desc + 1] + " (edited)".encode()
          variants = [
              ("base", base),
              ("good: line 57 rewritten, CRLF kept", b"\r\n".join(good)),
              ("bad: one LF-only line inserted", b"\r\n".join(L[:i57]) + b"\r\nNEW LINE\n" + b"\r\n".join(L[i57:])),
              ("bad: whole file converted to LF", base.replace(b"\r\n", b"\n")),
              ("bad: description edited, CRLF kept", b"\r\n".join(bad_desc)),
          ]
          try:
              for name, data in variants:
                  f.write_bytes(data)
                  ok = guard_ns["crlf_guard"](str(ARIA), rel)
                  same_tr = fm(base, True) == fm(data, True)
                  same_raw = fm(base, False) == fm(data, False)
                  print(f"[{name}] crlf_guard={ok} frontmatter_same(tr -d CR)={same_tr} frontmatter_same(raw awk)={same_raw} raw_awk_bytes={len(fm(data, False))}")
          finally:
              f.write_bytes(base)


      def n8_block():
          print("== N8 (same-form rewrites: phase-c-integrator :57 / :754, audit-engine :423) ==")
          pc = (ARIA / "skills/phase-c-integrator/SKILL.md").read_bytes().decode("utf-8")
          ae = (ARIA / "skills/audit-engine/SKILL.md").read_text(encoding="utf-8")
          P = "pre_merge 按 C.2 pre_hook 步骤 3 的优先级链判为启用"
          pc57 = pc.replace('当 `audit.enabled=true` 且 `audit.checkpoints.pre_merge != "off"` 时，C.2 合并前触发',
                            f"当 `audit.enabled=true` 且 {P}时，C.2 合并前触发")
          pc_both = pc57.replace('**仅 `audit.enabled=true` 且 `audit.checkpoints.pre_merge != "off"` 时**',
                                 f"**仅 `audit.enabled=true` 且 {P}时**")
          ae_t = ae.replace("**仅 `audit.enabled=true` 且 pre_merge checkpoint != off** 时", f"**仅 `audit.enabled=true` 且 {P}时**")
          pc_del = "\n".join(l for l in pc_both.split("\n") if "C.2 合并前触发 audit-engine" not in l)
          pc_step3 = pc_del.replace("3. 检查 audit.checkpoints.pre_merge", f"3. {P} (改写中) 检查 audit.checkpoints.pre_merge")
          states = [
              ("baseline", pc, ae),
              ("target", pc_both, ae_t),
              ("bad: only :57 rewritten", pc57, ae_t),
              ("bad: audit-engine :423 untouched", pc_both, ae),
              ("bad: :57 sentence deleted, phrase moved into step 3", pc_step3, ae_t),
          ]
          for name, a, b in states:
              print(f"[{name}] N8={ns['n8'](a, b)}")


      def n9_block():
          print("== N9 (commit attribution between base and tip) ==")
          d = WORK / "n9"
          repo = d / "repo"
          run(["git", "init", "-q", "-b", "master", str(repo)])
          (d / "attrib.py").write_text(M["commit_attribution"]["code"], encoding="utf-8")
          g = ["git", "-C", str(repo), "-c", "user.email=a@b", "-c", "user.name=a"]
          clock = [1789660000]  # 钉死并单调递增: 同秒提交的 git log 顺序不稳定 (实测 6 个提交里 4 个同秒)

          def at():
              clock[0] += 60
              return {"GIT_AUTHOR_DATE": f"{clock[0]} +0000", "GIT_COMMITTER_DATE": f"{clock[0]} +0000"}

          def commit(path, text, msg):
              f = repo / path
              f.parent.mkdir(parents=True, exist_ok=True)
              f.write_text(text, encoding="utf-8")
              run(g + ["add", path])
              run(g + ["commit", "-q", "-m", msg], env=at())

          def check(name, *extra):
              p = run([sys.executable, "-B", str(d / "attrib.py"), "base", "HEAD", *extra], cwd=repo, check=False)
