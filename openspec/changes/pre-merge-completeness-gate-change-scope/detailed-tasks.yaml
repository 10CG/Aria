              time.sleep(0.05)
          rc3, hb = gate(local, str(SS / "phase1_gate.py"), "--heartbeat-only", "--raw-track-id", raw, "--phase", "D")
          print(f"    fixture: own claim acquired and pushed; second clone pushed another claim "
                f"(push_success={g2.get('push_success')}); local heartbeat on the stale value: "
                f"outcome={hb.get('outcome')} push_success={hb.get('push_success')} (local ref now diverged)")
          saved = run(["git", "-C", str(local), "rev-parse", REF]).stdout.strip()
          pre("before release: precheck on the diverged state", local)
          release("as-written (v2.5 order): release_gate straight after precheck", local)
          pre("after as-written release: precheck", local)
          run(["git", "-C", str(local), "update-ref", REF, saved])  # fixture: 回到 release 之前, 换 v2.6 顺序重跑
          run(["git", "-C", str(local), "fetch", "-q", "origin", f"+{REF}:{REF}"])
          print(f"[v2.6 order: forced alignment, re-resolve] statuses={resolve(local)}")
          release("v2.6 order: release_gate after alignment", local)


