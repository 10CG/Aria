          AB_SUITE = ("aria-plugin-benchmarks/ab-suite/audit-engine.json",
                      "aria-plugin-benchmarks/ab-suite/version.yaml")
          AB_RESULTS = "aria-plugin-benchmarks/ab-results/2026-09-20-run"

          def ab_suite_commit(*msgs):
              for p in AB_SUITE:
                  f = repo / p
                  f.parent.mkdir(parents=True, exist_ok=True)
                  f.write_text("a\n", encoding="utf-8")
              run(g + ["add", *AB_SUITE])
              args = []
              for m in msgs:
                  args += ["-m", m]
              run(g + ["commit", "-q", *args], env=at())

          run(g + ["reset", "-q", "--hard", "HEAD~1"])
          commit(".aria/notes/2026-09-17-199-a2-a3-tooling/gen_yaml.py", "gen\n", "tooling dir only")
          check("own: tooling dir only (v2.2 judged this foreign)")
          run(g + ["reset", "-q", "--hard", "HEAD~1"])
          ab_suite_commit("chore(ab-suite): TASK-023 shape, no trailer")
          check("bad: TASK-023 shape (ab-suite pair only, no Spec trailer)")
          run(g + ["reset", "-q", "--hard", "HEAD~1"])
          ab_suite_commit("chore(ab-suite): TASK-023 shape", TRAILER)
          check("TASK-023 shape (ab-suite pair only, Spec trailer present)")
          run(g + ["reset", "-q", "--hard", "HEAD~1"])
          commit(AB_RESULTS + "/RESULT.md", "r\n", "ab-results only")
          check("bad: ab-results without extra")
          check("ab-results with extra (the only mechanism that passes it)", AB_RESULTS)


      def n10_block():
          print("== N10 (guard_config_hooks: config.json / hooks.json must not mention the symbol) ==")
          cmd = M["sc12_liveness"]["guard_config_hooks"].split(" —— ")[0]

