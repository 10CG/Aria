              set_json(False); set_skill("bash"); set_spec(True, drop_32_token=True); probe("F bad: 3.2 line loses the script token")
              print("== N1 (Step 3 exclusions) / N2 (Step 2 exemption split) on execution-modes.md ==")
              for kind in ("baseline", "target", "bad_excl_in_step4", "bad_excl_as_prose", "bad_step2_pre_ruling", "bad_step2_markers_merged"):
                  t = EM.read_text(encoding="utf-8") if kind == "baseline" else em_variant(kind)
                  print(f"[{kind}] N1={n1(t)} N2={n2(t)}")
              print("== N3 (completeness_gate.py imports are stdlib only, AST) ==")
              set_script(False); print(f"[baseline: script absent] N3={n3(GP)}")
              for kind, body in (("target", STUB_OK), ("bad_third_party_import", STUB_THIRD_PARTY), ("bad_relative_import", STUB_RELATIVE)):
                  GP.write_text(body, encoding="utf-8"); print(f"[{kind}] N3={n3(GP)}")
              GP.unlink()
          finally:
