          SHARED_FILES = ("CLAUDE.md", "VERSION", "README.md", "docs/architecture/system-architecture.md")
          TRAILER = "Spec: openspec/changes/pre-merge-completeness-gate-change-scope (10CG/Aria#199)"

          def release_commit(*msgs):
              for p in SHARED_FILES:
                  f = repo / p
                  f.parent.mkdir(parents=True, exist_ok=True)
                  f.write_text("v\n", encoding="utf-8")
              run(g + ["add", *SHARED_FILES])
              args = []
              for m in msgs:
                  args += ["-m", m]
              run(g + ["commit", "-q", *args], env=at())

          run(g + ["reset", "-q", "--hard", "HEAD~1"])
