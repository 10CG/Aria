          cfg = ROOT / ".aria/config.json"
          orig = cfg.read_text(encoding="utf-8")
          try:
              cfg.write_text(orig.replace('"version"', '"_note": "completeness_gate", "version"', 1), encoding="utf-8")
              guard("bad: .aria/config.json mentions the symbol")
              hk = ARIA / "hooks/hooks.json"
              hk_orig = hk.read_text(encoding="utf-8")
              cfg.write_text(orig, encoding="utf-8")
              hk.write_text(hk_orig.replace("{", '{"_note": "completeness_gate", ', 1), encoding="utf-8")
              guard("bad: aria hooks.json mentions the symbol")
              hk.write_text(hk_orig, encoding="utf-8")
          finally:
              cfg.write_text(orig, encoding="utf-8")


