          # 本轨 claim 由 fixture 自造 (raw id 每跑唯一), 远端是临时裸仓, 不碰真仓协调 ref
          raw = "zz-release-own-" + uuid.uuid4().hex[:8]
          ctx = {}

          def gate(repo, *args):
              p = run([sys.executable, "-B", *args, "--repo-path", str(repo)], cwd=repo, check=False)
              return p.returncode, json.loads(p.stdout)

          def pre(name, repo):
              p = run([sys.executable, "-B", str(d / "precheck.py"), *sorted(ctx["own"])], cwd=repo, check=False)
              o = json.loads(p.stdout)
              print(f"[{name}] exit={p.returncode} verdict={o['verdict']} kinds={[a['kind'] for a in o.get('ahead', [])]}")

          def resolve(repo):  # TASK-001 claim 身份条
              st = []
              for f in run(["git", "-C", str(repo), "ls-tree", "-r", "--name-only", REF]).stdout.split():
                  if f.startswith(f"claims/{ctx['container']}/"):
                      y = yaml.safe_load(run(["git", "-C", str(repo), "show", f"{REF}:{f}"]).stdout)
                      if y.get("track_id") == raw:
                          st.append(y.get("status"))
              return sorted(st)

          def release(name, repo):
              rc, o = gate(repo, str(SS / "release_gate.py"), "--raw-track-id", raw, "--status", "done")
              r = o.get("released") or {}
              rem = run(["git", "-C", str(repo), "ls-remote", "origin", REF]).stdout.split()
              eq = bool(rem) and rem[0] == run(["git", "-C", str(repo), "rev-parse", REF]).stdout.strip()
              print(f"[{name}] exit={rc} fetch_success={o.get('fetch_success')} released.success={r.get('success')} "
                    f"push_success={o.get('push_success')} hard_error={o.get('hard_error')} remote_equals_local={eq}")

          rc, acq = gate(local, str(SS / "phase1_gate.py"), "--raw-track-id", raw, "--phase", "D", "--mode", "advisory")
          oc = acq["own_claim"]
          ctx["container"] = oc["container"]
          ctx["own"] = {f"claims/{oc['container']}/{oc['session']}.yaml"}
          run(["git", "-C", str(other), "fetch", "-q", "origin", f"+{REF}:{REF}"])
          rc2, g2 = gate(other, str(SS / "phase1_gate.py"), "--raw-track-id", "zz-release-other-" + uuid.uuid4().hex[:8],
                         "--phase", "A.1", "--mode", "advisory")
          t0 = int(time.time())
