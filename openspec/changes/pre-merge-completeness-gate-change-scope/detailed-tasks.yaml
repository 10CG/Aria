          run(g + ["reset", "-q", "--hard", "HEAD~1"])
          release_commit("chore(release): aria-plugin vX 主仓同步面 — gitlink a->b", TRAILER)
          check("own release sync (shared paths only, Spec trailer present)")
          commit("docs/other.md", "o2\n", "foreign file rides along\n\n" + TRAILER)
          check("bad: foreign path + Spec trailer (trailer must not launder a foreign path)")
