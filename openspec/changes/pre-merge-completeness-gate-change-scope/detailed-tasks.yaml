      # 在主仓根执行: python3 -B sc12_liveness.py [--force-checked]
      # --force-checked: 4.3 用 (tasks.md 尚未勾选时把副本文本临时视为全勾选, 只影响 L3; L1 须在全勾选的 scratch 副本里跑)
