  a2_state_runs:
    what: tasks.md 重写 a 的三态 (另加两个对照态) 与 N1 / N2 / N3 的三态, 在 scratch 主仓副本 (主仓 a563192 + aria 1cb3872 嵌套 clone) 上实跑; 副本外零写入
    command: python3 -B a2_state_runs.py <scratch 主仓副本根> <本目录 tasks.md> <本文件>  (脚本全文见 script; 下方 output 由该命令重生成, 未手改)
    script: |
      #!/usr/bin/env python3
      """A.2 state runs for pre-merge-completeness-gate-change-scope (tasks.md rewrite a + checks N1/N2).

      usage: python3 -B a2_state_runs.py <scratch main-repo clone> <tasks.md> <detailed-tasks.yaml>
      The clone must be a throwaway copy: main repo checked out, aria a nested clone registered
      with `git submodule init aria` (so `git grep --recurse-submodules` sees it), clean tree.
      The script mutates only that copy and restores it at the end. Output has no paths or times.
      """
      import ast, json, re, shutil, subprocess, sys
      from pathlib import Path

      ROOT = Path(sys.argv[1]).resolve()
      TASKS, YAML = Path(sys.argv[2]).resolve(), Path(sys.argv[3]).resolve()
      SID = "pre-merge-completeness-gate-change-scope"
      SPEC = ROOT / "openspec/changes" / SID
      LIB = ROOT / "aria/skills/state-scanner/scripts/lib"
      SK = ROOT / "aria/skills/audit-engine/SKILL.md"
      EM = ROOT / "aria/skills/audit-engine/references/execution-modes.md"
      GP = ROOT / "aria/skills/audit-engine/scripts/completeness_gate.py"
      AEJ = ROOT / "aria-plugin-benchmarks/ab-suite/audit-engine.json"
      DEF = "aria/skills/audit-engine/scripts/completeness_gate.py"
      CALL = ('python3 "${CLAUDE_PLUGIN_ROOT:-aria}/skills/audit-engine/scripts/completeness_gate.py" \\\n'
              '  --repo-path "<主仓 root>" --diff-repo-path "<C.2 合并目标仓 root>" \\\n'
              '  --base "<diff 仓主干的远程跟踪 ref>" [--anchor-base "<主仓主干的远程跟踪 ref>"] \\\n'
              '  [--change-id <id> ...] [--no-spec]\n')
      sys.path.insert(0, str(LIB.parent))  # package context; a bare `import spec_complete` hits a circular import
      from lib import spec_complete as sc  # noqa: E402

      def git(cwd, *a):
          subprocess.run(["git", *a], cwd=cwd, check=True, capture_output=True)

      def set_spec(checked, drop_32_token=False):
          t = TASKS.read_text(encoding="utf-8")
          if checked:
              t = re.sub(r"^(\s*[-*]\s*)\[ \]", r"\1[x]", t, flags=re.M)
          if drop_32_token:
              t = re.sub(r"^(- \[.\] 3\.2 .*)$", lambda m: re.sub(r"`[^`]*completeness_gate\.py`", "门脚本", m.group(1)), t, flags=re.M)
          (SPEC / "tasks.md").write_text(t, encoding="utf-8")
          shutil.copyfile(YAML, SPEC / "detailed-tasks.yaml")

      STUB_OK = ("import argparse\nimport json\nimport subprocess\nimport sys\n\n"
                 "GATE = \"completeness_gate\"  # stdout 契约的 gate 字段, 真实脚本必含此字面\n\n"
                 "def main():\n    return 0\n")
      STUB_THIRD_PARTY = STUB_OK + "import yaml\n"
      STUB_RELATIVE = STUB_OK + "from . import helpers\n"

      def n3(path):
          if not path.is_file():
              return False
          mods = set()
          for node in ast.walk(ast.parse(path.read_text(encoding="utf-8"))):
              if isinstance(node, ast.Import):
                  mods |= {a.name.split(".")[0] for a in node.names}
              elif isinstance(node, ast.ImportFrom):
                  mods.add("<relative>" if node.level else (node.module or "").split(".")[0])
          return bool(mods) and mods <= set(sys.stdlib_module_names)

      def set_script(on):
          if on:
              GP.write_text(STUB_OK, encoding="utf-8")
              git(ROOT / "aria", "add", "-f", str(GP.relative_to(ROOT / "aria")))
          elif GP.exists():
              git(ROOT / "aria", "reset", "-q", "--", str(GP.relative_to(ROOT / "aria")))
              GP.unlink()

      def set_skill(mode):
          git(ROOT / "aria", "checkout", "-q", "--", "skills/audit-engine/SKILL.md")
          if mode == "orig":
              return
          L = SK.read_text(encoding="utf-8").split("\n")
          i = next(k for k, l in enumerate(L) if "scripts/sibling_spec_probe.py" in l and L[k - 1].startswith("```bash"))
          add = ["", "```bash", *CALL.rstrip("\n").split("\n"), "```"] if mode == "bash" else ["", "调用: " + CALL.replace("\\\n", " ").strip()]
          L[i + 2:i + 2] = add  # after the probe block's closing fence
          SK.write_text("\n".join(L), encoding="utf-8")

      def set_json(on):
          git(ROOT, "checkout", "-q", "--", "aria-plugin-benchmarks/ab-suite/audit-engine.json")
          if on:
              d = json.loads(AEJ.read_text(encoding="utf-8"))
              d["evals"].append({"id": 3, "name": "pre-merge-completeness-gate", "prompt": "(sim)", "expected_output": "(sim)",
                                 "expectations": ["步骤清单写出调用 completeness_gate.py 的完整命令行"]})
              AEJ.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      def probe(name):
          text = (SPEC / "tasks.md").read_text(encoding="utf-8")
          items = sc._iter_task_items(text)
          claims = [it for it in items if it["checked"] and sc._line_has_integration_keyword(it["line"])]
          syms = {}
          for c in claims:
              syms[c["parent_id"]] = sc.extract_claim_symbols(SPEC, c)["symbols"]
          l3 = "completeness_gate" in syms.get("3.2", [])
          lv = sc.classify_symbol_liveness("completeness_gate", ROOT, {DEF})
          l2 = lv["status"] == "alive" and "aria_plugin_integration" in lv["alive_categories"]
          out = subprocess.run([sys.executable, "-B", str(LIB / "spec_complete.py"), "--gate", str(SPEC)], capture_output=True, text=True)
          g = json.loads(out.stdout)
          blk = [b for b in g["blocking_reasons"] if "completeness_gate" in b]
          l1 = g["verdict"] != "block" and not blk
          print(f"[{name}] checked={sum(i['checked'] for i in items)}/{len(items)} integration_claims="
                f"{sorted(syms)} L3={l3} L2={l2} (status={lv['status']} categories={lv['alive_categories']}) "
                f"L1={l1} (gate verdict={g['verdict']} exit={out.returncode} blocking_on_symbol={len(blk)})")
          return syms, g

      def slice_lines(text, a, b):
          L = text.split("\n")
          s = next(i for i, l in enumerate(L) if re.match(a, l))
          e = next(i for i in range(s + 1, len(L)) if re.match(b, L[i]))
          return L[s:e]

      def n1(text):
          try:
              sl = slice_lines(text, r"\s*Step 3:", r"\s*Step 4:")
          except StopIteration:
              return False
          return all(sum(bool(re.match(rf'\s*- key != "{k}"', l)) for l in sl) == 1 for k in ("post_brainstorm", "mid_implementation"))

      def n2(text):
          try:
              sl = slice_lines(text, r"\s*Step 2:", r"\s*Step 3:")
          except StopIteration:
              return False
          hits = [l for l in sl if "仍逐对评估三态并全部留痕" in l]
          if len(hits) != 1:
              return False
          head, sep, tail = hits[0].partition(";")
          return bool(sep) and "no_spec_unverifiable" in head and "no_spec_unverifiable" not in tail \
              and "no_spec_contradicted" in tail and "不被本键豁免" in tail

      S2_NEW = ("      → 仍逐对评估三态并全部留痕, 只把 missing / scope_unresolved / spec_level_undetermined / "
                "no_spec_unverifiable 降为 verdict=bypassed (exit 0) 并短路终止求值; no_spec_contradicted / "
                "change_id_unanchored 不被本键豁免")
      S2_OLD_PROPOSAL = ("      → 仍逐对评估三态并全部留痕, 只把 missing / scope_unresolved / spec_level_undetermined 降为 "
                         "verdict=bypassed (exit 0) 并短路终止求值; no_spec_contradicted / no_spec_unverifiable / "
                         "change_id_unanchored 不被本键豁免")
      EXCL = ['      - key != "mid_implementation"(条件触发, 进度未过阈值时合法不产出)',
              '      - key != "post_brainstorm"(条件性产物, 与 change_id 无机械关联)']

      def em_variant(kind):
          L = EM.read_text(encoding="utf-8").split("\n")
          s2 = next(i for i, l in enumerate(L) if "→ 跳过校验, 继续执行 pre_merge 审计" in l)
          s3_end = next(i for i, l in enumerate(L) if re.match(r"\s*Step 4:", l)) - 1  # blank line before Step 4
          s4_end = next(i for i, l in enumerate(L) if re.match(r"\s*Step 5:", l)) - 1
          if kind == "target":
              L[s3_end:s3_end] = EXCL
              L[s2] = S2_NEW
          elif kind == "bad_excl_in_step4":
              L[s4_end:s4_end] = EXCL
              L[s2] = S2_NEW
          elif kind == "bad_excl_as_prose":
              L.append("注: Step 3 另排除 post_brainstorm 与 mid_implementation。")
              L[s2] = S2_NEW
          elif kind == "bad_step2_pre_ruling":
              L[s3_end:s3_end] = EXCL
              L[s2] = S2_OLD_PROPOSAL
          elif kind == "bad_step2_markers_merged":
              L[s3_end:s3_end] = EXCL
              L[s2] = S2_NEW
              L = [re.sub(r"Step 3:", "Step 3 (枚举):", l) for l in L]
          return "\n".join(L)

      def main():
