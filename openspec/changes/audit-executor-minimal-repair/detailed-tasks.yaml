  contracts:
    cli:
      build: "python3 -I aria/skills/audit-engine/scripts/audit_executor.py build --repo-path REPO --manifest MANIFEST --output-dir RUN_DIR"
      collect: "python3 -I aria/skills/audit-engine/scripts/audit_executor.py collect --repo-path REPO --manifest MANIFEST --build-record BUILD_RECORD --workflow-run-id RUN_ID --native-record NATIVE_RECORD --output ROUND_RESULT"
      prepare_policy: "在collect完整基础参数上加 --prepare-policy，与--check-result互斥；只封存审计证据/生成policy-request及必要的独立checker脚本，不发布round-result/MD，不表示审计通过。"
      previous_round: "prepare/final/check的--previous-round指紧邻有效轮，必须等于manifest.evidence.previous_round及固定scope有效head；有效round=1省略，void尝试由完整账本保留。"
      check_result: "最终collect的相同输入上增加 --check-result ROUND_RESULT；只读重算base/存在的合法disposition sidecar，不写锁、账本或文件。prepare后native参数指冻结副本。参数名遵循proposal revision2，不新增取消、动态加载或重试服务接口。"
      arguments: "大写参数指执行时由宿主取得的实际值，不将示例变量写进产品报告；RUN_DIR/ROUND_RESULT 均使用本次 run-key，不能指向 PR #38 旧报告。"
    manifest:
      required: [audit_cycle_id, client_round_id, checkpoint, change_id, round, attempt_index, candidate_sha, roles, single_agent_ms, round_ms, max_parallel, require_same_admitted_roles, evidence]
      roles: "每项包含 role_id、agentType、model_alias、冻结 prompt；role_id/agentType 逐项等于项目显式团队数组的完整注册名，保持顺序且唯一。模型别名只追溯，不作为 agent model 覆载。"
      identities: "两个 id 在 VM 外生成；audit_cycle_id 跨轮/会话续用，不能因不可比、全失败或恢复会话自动换 id 重置预算。"
      policy_inputs: "executor-contract §10.2：运行前FileRef为cycle_origin/previous_round/dispatch_preflight/policy_inputs；三个post_*_index_path是未来locator，不伪填hash/runId。首次null由固定scope无旧周期来源扫描判定，genesis由build生成后被build-record引用；后续null/换cycle拒绝。"
      round_semantics: "round为有效逻辑轮号，attempt_index含void单调递增；void不耗额度、不推进round、不替换previous/stability、不进normal序列、不完成refocus义务。skipped不增也不清零consecutive_refocus_count。"
      native_indexes: "audit-engine capture adapter取真实runId/Transcript入口/显式路径，写audit/drift/disposition索引；这些是新wrapper而非native字段。Python验证agent/uuid/完整原件并封存，损坏引用拒绝，未提供终态引用才unknown。"
    config_source: "固定读取 REPO/.aria/config.json 与当前插件 DEFAULTS；manifest 只有期望值，没有覆盖权。严格校验原始 JSON 与守卫布尔类型，然后合并；true 下须有 checkpoint 显式团队且实际 mode=convergence。"
    budgets: {single_agent_ms: 120000, round_ms: 300000, max_parallel: 2}
    timing: "准入 q=原生 queuedAt，C=startedAt+durationMs，D=原生 Workflow startTime+300000；C-q<=120000 且 C<D。调度从 VM timer 安装 S0 起计 300000，control_native_alignment=unknown；不得猜 S0 与原生时间偏移。"
    state_priority: [not_dispatched, dispatched_no_completion, completed_late, completed_no_result, completed_parse_error, completed_admitted]
    termination_evidence: [completed, interrupted_observed, unknown]
    pair_guard: "只配对同cycle/checkpoint/change且有效round相邻、固定账本最新有效head的真实准入集合；完整重算前史，void不替换head；candidate/model只追溯。"
    result_consumption: "true路径build → 真实审计Workflow(scriptPath,args) → collect --prepare-policy → 必要的独立drift Workflow → 最终collect → 同源--check-result → 消费commit完整的JSON/MD及存在的合法sidecar；false完整legacy。"
    schema_details: "executor-contract §10为revision2字符级SOT；原生/双时钟/六态/raw主体保留，不执行历史脚本。revision2检查点已通过/由本次真实owner依法接受未收敛结论；仍须TASK-002完整独立两阶段任务审查接受后才实现目标接口。"
    cycle_storage: "固定 .aria/audit-reports/_executor-ledgers/<sha256(C([checkpoint,change_id]))>/，不含cycle/candidate；genesis+连续reserve/commit/observe/disposition+POSIX flock短锁。pending禁止重派；同reservation/同输入/同字节才窄恢复，不覆盖，不自动rollover。"
    freeze_order: "前源字节/manifest→genesis→script→reserve→build-record；audit→index→冻结闭包→policy-request→checker script；drift→index→最终闭包→result/MD→commit。result不引用自身/未来commit，genesis不反引build-record；当前固定源漂移拒绝，历史读冻结字节不执行旧代码。"
    canonical_aggregation: "canonical_v1：仅准入findings；精确category/scope bucket最高severity，每type一结论保留该type所有完整C(finding) variants与members；差异标unresolved_variants不冒充语义矛盾，完整四元组比较/排序，短id仅展示，禁止prior_id/路径归一化。阈值使用binary64 /与>=，不换Decimal/Fraction。"
    human_disposition: "真实AskUserQuestion/tool_result关联tool_use_id/sourceToolAssistantUUID及toolUseResult.questions/answers/annotations；绑定cycle/耗尽head/三选项，一次性消费。旧样本只证schema；同collect参数另写sidecar/disposition不改base，increase固定+2，accept/degrade保持converged=false。"
    amendment_vectors: "proposal A-1..A-6映射原SC，contract §10.8正常链及四组坏态；非作者QA独立构造坏态并验证指定原因，不能靠自报boolean或短hash绿灯。"
  execution_policy:
    authorization: "用户goal已授权TASK-001..019的Phase B及动态Workflow；TASK-015/016/017按该授权执行规格内配置接入、真实探针与Rule #6，仍须核实实际平台/启动条件，不将授权扩张到范围外操作。TASK-020/021仍分别须Phase C/D授权；依赖完成不构成授权。"
    gates: "主控按实际配置在原定时点执行 enabled mid_implementation、条件触发 mid_post_spec、post_implementation、pre_merge、post_closure；不得攒到收尾补跑、降级、关门或改序。post_planning 不由本文件作者执行。"
    scheduling: "dependencies 为必要前置，execution_order 为一种实填拓扑序；无依赖不自动许可并行，仍须文件域不相交。测试/实现同一文件必须串行，不能按 Agent 名不同并行。"
    serialized_write_domains:
      - paths: [*executor, *tests]
        order: [TASK-004, TASK-005, TASK-006, TASK-007, TASK-008, TASK-010, TASK-013]
      - paths: [*engine_skill, *execution_modes]
        order: [TASK-012, TASK-014]
      - paths: [*contract]
        order: [TASK-002, TASK-014]
    allowed_parallel_groups:
      - [TASK-003, TASK-009]
    max_audit_concurrency: 2
    max_heavy_experiments: 1
    resource_reference: "沿用已注入的 shared-host-throttle / feedback_shared_host_cpu_throttle_experiments 与 aria-plugin-benchmarks/AB_TEST_OPERATIONS.md §并发控制；不把容器本地 memory 路径变成产品依赖。"
    resource_discipline: "重实验前按既有纪律限制会话进程树 nice=19、ionice class 2/nice 7、CPU 0-1；同刻单一重实验，审计席并发<=2，探针全量每席<=2次，坏实现只跑相关子集。时档测试沿用一分钟负载<2的串行准入，不改阈值、不把 loadavg 当核数；无合格窗口则 NOT-JUDGED 并阻断相应验收。"
    tdd: "各代码任务先写可失败断言、保存指定原因 RED，再最小实现 GREEN；首次缺模块的 import error 只证明宿主未建，不能替代后续行为 RED。GREEN 必须有实际 judged 用例，不以 exit 0 掩盖整批 skip。负控是正确实现通过、故障实现被指定断言判红，不接受坏态也绿。"
    historical_data: "R2-R5 portable fixtures 只读；不执行 sources/ 的历史 JS/Python 文本，不依赖原机器绝对路径，不伪造历史 build-record 或把旧报告补成新准入证据。"
    phase_b_exit: "SC-1..SC-10 的证据须同时包含单测、非作者坏实现负控、真实完整接线探针和 skill-creator Rule #6；Spec/规划审计通过不等于实现完成。"
    invalidation: "后续若改动已验文件/指令，重跑受影响测试；Skill 指令或 description 变化使 TASK-017 对应结果失效，须重跑后才能进入发布。"
  rule6_obligation:
    decision_table_row: 2
    planned_description_change: false
    scenario1: required
    scenario4b: required_if_description_changes
    executor: skill-creator
    references: [standards/conventions/skill-benchmark-exemption.md, aria-plugin-benchmarks/AB_TEST_OPERATIONS.md]
    evidence_rule: "当前未执行，不填充伪结果；TASK-017 实跑后在本任务的 rule6_note 写 SOT §4.1 五字段与真实结果目录。单测、结构测试和实际 Workflow 探针都不能替代场景1。"
  version_policy: "不预定版本号。实现/发布时重新实取 aria/.claude-plugin/plugin.json 与版本管理规范，再决定兼容级别和同步面；产品交付面不写版本占位符。"
  protected_boundary: "PR #38 继续暂停；保留旧 source/报告、原 cycle_id、轮数、converged/merge_clearance 和 max_rounds=5。本 Spec 的审计/探针属于独立目标，不恢复、回填或重开 PR #38。"

