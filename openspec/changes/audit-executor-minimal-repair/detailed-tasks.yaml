      - aria/skills/audit-engine/tests/fixtures/audit_executor/negative-controls.json
      - .aria/audit-reports/audit-executor-minimal-repair/negative-controls-evidence.json
    agent: qa-engineer
    reason: "测试拒绝能力须由非实现作者独立构造真实故障形状，避免同源盲区。"
    sc_coverage: [SC-4, SC-5, SC-6, SC-7, SC-8, SC-10]
    interfaces:
      input: "已冻结executor-contract、批准SC和当前正确宿主；不得由实现席提供一套自证负控取代独立构造。"
      output: "隔离临时副本上的故障实现/输入、指定失败断言及逐项CAUGHT证据；不将mutant写入产品脚本。"
    negative_controls:
      - shape: ignore_roles
        fault: "stable只比较四元组，不看角色。"
        must_fail: "keys相等而角色不同，断言stable=false/converged=false/population_changed；故障输出true使测试红。"
      - shape: cardinality_only
        fault: "用admitted_count相等替代role_id集合相等。"
        must_fail: "两轮各两席但仅一席相同，人数均2仍必须population_changed；故障输出comparable=true使测试红。"
      - shape: release_without_cancel
        fault: "120000ms超时就补派，但原agent Promise未返回且无取消确认。"
        must_fail: "可控调度记录实际未返回调用峰值4；<=2断言红，不能只观察两个逻辑worker后说通过。"
      - shape: tampered_result
        fault: "改converged或admitted_roles后check-result仍返回0，或报告消费者跳过check。"
        must_fail: "指定篡改必须非零且报告未变，消费者不消费；故障接受/继续消费使断言红。"
      - shape: missing_evidence_fallback_false
        fault: "缺native/previous参与证据或配置非法时回落guard=false再按legacy放行。"
        must_fail: "缺native/非法配置应错误，旧previous缺证应comparable=false/stable=false；故障回落后true或exit0使断言红。"
    steps:
      - "测试席与TASK-004..010实际实现作者必须为不同执行者；依据接口独立构造以上五类，可添加同根坏输入但不扩大产品功能。"
      - "先用正确实现跑指定场景得GREEN，再只替换隔离副本的对应故障点，保存故障diff/hash、实际执行分支和指定原因RED；非零崩溃但未到指定断言不算CAUGHT。"
      - "按相关子集串行跑物理并发/时间类负控；不建自研AB runner、不运行历史脚本、不触真实LLM。"
    verification:
      - "python3 -I -m unittest discover -s aria/skills/audit-engine/tests -p test_audit_executor_negative_controls.py -v"
      - "五类均记录correct=GREEN、fault=CAUGHT及指定断言；证明错误实现被拒绝，不能只记当前结果false。测试作者身份/实现作者身份与故障来源可追溯。"
      - "若timer/进程/mtime被控制，相关时钟与状态源必须完整冻结；整批SKIP记NOT-JUDGED，逐例补跑后才允许验收。"

