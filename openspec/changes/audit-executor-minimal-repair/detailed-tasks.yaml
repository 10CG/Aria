tasks:
  - id: TASK-001
    parent: "5.2"
    title: "建立实施前的只读保护基线与授权边界"
    status: completed
    phase: B
    authorization: phase_b_approval_required
    complexity: S
    estimated_hours: "2-4"
    dependencies: []
    deliverables:
      - .aria/audit-reports/audit-executor-minimal-repair/integrity-before.json
    agent: tech-lead
    reason: "需要跨主仓、插件和旧审计周期建立证据边界，避免将新机制验收变成旧周期重启。"
    sc_coverage: [SC-9, SC-10]
    interfaces:
      input: ".aria/notes/2026-11-01-pr38-audit-execution-diagnosis/{sources.json,verification.json}、其列出的原件、PR #38 旧报告及原审计配置。"
      output: "按项目相对路径记录原件 SHA-256/大小、旧报告内容 hash、原 cycle/轮数及 max_rounds=5；仅写新 evidence 文件，不读写 secret 值。"
    steps:
      - "另获 Phase B 授权后，主控先核验并发在制轨与当前边界；本任务不 acquire/release claim，不修改 PR #38 状态。"
      - "用 stdlib 哈希读取 sources.json 所指原件，校验已有保全清单；记录本次保护总体，不重复分析根因、不执行历史脚本。"
      - "记录 PR #38 保持暂停、本 Spec change_id 与未来独立探针 context；若原 max_rounds 不再为5或原件与保全不符，停止并报告，不能覆盖基线掩盖差异。"
    verification:
      - "对清单每个原件独立重算 SHA-256 后与记录逐一相等；缺文件、少一项或 hash 不等均失败，不能以文件数量相等代替。"
      - "新 evidence 不含新审计票、旧 cycle 的新 round 或 PR #38 写回；TASK-018 将使用同一总体作 before/after 对照。"

  - id: TASK-002
    parent: "1.1"
    title: "固化 build/collect/check-result 与证据来源契约"
    status: completed
    phase: B
    authorization: phase_b_approval_required
    complexity: M
    estimated_hours: "4-6"
    dependencies: [TASK-001]
    deliverables: [*contract]
    agent: backend-architect
    reason: "先将已批准 Spec 转成实现与测试共用的严格接口，防止各自补齐出不同语义。"
    revision2:
      input: "主控implementation-ruling、两份设计及真实human-decision shape；proposal revision2 amendment。"
      files: [*contract]
      interface: "补prepare、manifest.evidence/attempt_index、前后索引、原字节闭包、固定scope/genesis/锁/窄恢复、问答sidecar、canonical_v1；保留原生/双时钟/六态。"
      acceptance: "A-1..A-6均有全字段无环正常链及指定拒绝；B_*设计闭合不等于实现通过。完整独立两阶段任务审查及三项Important修复复核已PASS，TASK-002仅契约交付completed；post_planning的owner接受不替代本任务审查，产品实现仍须后续验证。"
    sc_coverage: [SC-1, SC-5, SC-6, SC-7, SC-8]
    interfaces:
      input: "proposal What §2-6、公开 Workflow 接口、诊断 README 和 sources/workflow-R5-script.txt 的 parse 契约；后者仅作为文本依据。"
      output: "executor-contract.md固定manifest/build-record/原生映射/round-result/raw/错误表，以及build、collect --prepare-policy、最终collect、只读check与处置sidecar的闭合接口和冻结时序。"
    steps:
      - "逐字段列出 native startTime/queuedAt/startedAt/durationMs、run_id、嵌入 script、标签/agentType、完成/中断原件和完整性标记的真实来源；路径由外部显式传入，不从 subagents 顶层猜测。"
      - "将 JSON 或整体 fenced JSON raw 契约钉为 vote、coverage_complete、findings、pending、prior_findings；finding 的 severity/type/category/scope/file/line/failure_scenario 沿用既有验证，coverage不足、pending或Major/Critical要求REVISE。仅 PASS/REVISE 票进入既有投票语义。"
      - "列出配置/defaults/生成 script/native/previous 等输入 hash、双时钟、六态 first-match、termination_evidence 和迟到 raw 引用字段；将实际 model 标签与配置别名分开。"
      - "定位旧汇总层的 verdict/drift/轮数输入及消费者；需要进入可重算输出的既有 policy 输入必须有可校验来源与 hash，不新设漂移策略、不将人工结论当成可验证输入。"
      - "明确 false 的 legacy 分支、true 的 Workflow/convergence/显式团队限制、unsupported 分支和 unknown 终态阻断新增派发；若真实接口无法表达批准契约，停下提 Spec 欠定，不发明取消/导入能力。"
    verification:
      - "对 build/collect/check-result 每个结果字段均能回链到输入字段、公式或既有 policy 来源；无来源的 boolean 不得以 false/true 默认补齐。"
      - "调用契约不出现 VM 内 Node/文件系统/本地模块、Date.now/随机 API 或单席取消；label 可由 client_round_id+索引确定且完整注册名逐项可校验。"
      - "首轮、缺证、非法类型、脚本内容错配、非相邻轮、unknown 终态的指定失败/非通过结果可直接派生测试，而不是笼统要求‘正确处理异常’。"

  - id: TASK-003
    parent: "1.1"
    title: "提取只读 portable R2-R5 与时间边界数据夹具"
