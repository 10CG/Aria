# A.2 分解过程中揭出的 spec 侧缺陷 (提交 post_planning 审计 / owner 裁定)
# ══════════════════════════════════════════════════════════════════
findings_for_post_planning:
  - id: F-1
    severity: major
    target: "proposal.md ##Success Criteria 抬头的「SC → 承载 Task 全表」"
    title: "该表把两种互不相同的「承载」定义混在一张表里, 自身不自洽"
    evidence:
      - "把**实现 Task** 算作承载的: SC-6 → 1.1·1.5 / SC-14 → 1.1·1.5 / SC-15 → 1.3b·1.5 / SC-16 → 1.1·1.3b·1.8 / SC-20 → 1.3·1.5 / SC-21 → 1.3·1.5"
      - "**不**把实现 Task 算作承载的: SC-1 → 1.5·1.8 (未含 1.3) / SC-5 → 1.5 (未含 1.2)"
      - "而 Task 1.3 正文明写「(a) 每段开头重置 has_filter … **验收 = SC-1 第 2/3 条**」—— 即 1.3 自认被 SC-1 验收, 表却未把它列入 SC-1 的承载"
      - "Task 1.2 正文零 SC 引用, 但它显然被 SC-5 (分段器单元, 数组基数断言) 验收"
    diagnosis: |
      **v10 复判 (owner 2026-08-12 裁定 2 采修正版; 本条非 v10 执笔席自己的 finding, 按 owner
      指示复核并更正其表述, 取代下方原 `two_readings` 字段)**: 原「两种读法」诊断把问题定位成
      "读者可以有两种理解方式, 都讲得通" —— 这站不住。三个独立席位 (tech-lead /
      knowledge-manager / code-reviewer, 互不相同的三个复核角色) 独立判出同一结论, 不是一处
      悬而未决的语义歧义。

      **真实情况是一种定义 + 两行漏填**: 全表 22 行里, 已有自证句式的行 (SC-9b「承载 Task =
      1.10」/ SC-19「1.5 + 1.6」/ SC-20「1.3 + 1.5」/ SC-21「1.3」) 一贯遵循同一条定义 ——
      承载 = 工作派单索引, 为满足这条 SC 哪些 Task 必须动手, 天然含实现 Task。SC-1 / SC-5
      是 v9 之前就存在的老 SC, v9 只给**新增**的 SC-9b/19/20/21 配了自证句式, 没有回填给
      同批的老 SC —— 根因是这道回填动作漏做, 不是定义本身有歧义。(旁证: SC-21 当时的自证
      句式写的是「承载 Task = 1.3」, 单看这一条本身与 F-1 表原行「1.3 · 1.5」就已不一致 ——
      这是同一根因 [回填不彻底] 在自证句式层面而非表格层面的又一实例, v10 已一并按 F-1 表
      订正为「1.3 · 1.5」, 见 proposal.md SC-21 条目自身与 code-reviewer m-5)

      **对「读法 A (承载 = 谁产验证物) 是稻草人」的 Q2 复核 (v10 执笔席独立验证, 非照抄)**:
      读法 A 若成立, 需 SC-6/14/15/16/20/21 六行**全部**剔除实现 Task (1.1/1.3/1.3b), 改动面
      达六行; 读法 B 只需给 SC-1/SC-5 两行**各补一项**。owner 实际裁定的修正版与读法 B 完全
      一致, 未触碰 SC-6/14/15/16/20/21 任何一行 (结果层面确认)。过程层面: 读法 A 从未在任何
      一条 SC 自身的「承载 Task = …」自证句式里出现过 (这些句式清一色把实现 Task 与验证
      Task 并列), 它只是审计时从两行"看起来不完整"的老 SC 反推出的一种**理论上自洽但从未
      被表本身实践过**的读法。⇒ 确认为稻草人, 本轮不采纳读法 A 的任何部分。
    why_it_matters: |
      这张表是 v9 机械闸判据 (a) 的产物, 而机械闸 ALL-GREEN 正是 owner 裁定进 A.2 的依据。
      判据 (a) 检的是「每条 SC 是否有承载者」这个**存在性**问题, 检不出「承载的定义是什么」这个
      **语义**问题 —— 于是表在存在性上全绿、在语义上不自洽, 两者不矛盾。
      这与 R6 的根因诊断同族: 机械闸能收口可穷举的判据, 收不了判据本身的定义缺口。
    a2_disposition: |
      **v9 原处置 (历史记录, 已被 v10 取代, 保留说明处置曾经历的过程)**: 按表的字面收敛,
      不擅自扩表 (INV-2 要求不得破坏映射)。受影响的三条 detailed task 改用 `verified_by` /
      `feeds_sc` 字段旁挂, 语义不丢但不进 carries_sc:
        TASK-003 (parent 1.2) verified_by: [SC-5]
        TASK-004 (parent 1.3) verified_by: [SC-1]
        TASK-010 (parent 1.4) feeds_sc: [SC-15, SC-19]   # 只产出分组/分支数据, 不承载验收

      **v10 处置 (owner 2026-08-12 裁定 2 采修正版落地, 本条闭环)**: proposal.md 表头写死
      「承载」定义, SC-1 行改「1.3 · 1.3b · 1.5 · 1.8」, SC-5 行改「1.2 · 1.5」, 并给两行
      补齐 SC-9b/19/20/21 式的自证句式回填。本文件同步转正 (旁挂字段升级为正式 carries_sc):
        TASK-003 (parent 1.2): `verified_by` 移除, `carries_sc` 补 SC-5
        TASK-004 (parent 1.3): `verified_by` 移除, `carries_sc` 补 SC-1
        TASK-007 (parent 1.3b): `carries_sc` 补 SC-1 (SC-1 承载新含 1.3b, TASK-007 是其下
          唯一 detailed task)
        TASK-010 (parent 1.4) 的 `feeds_sc: [SC-15, SC-19]` **不变** —— SC-15 / SC-19 的
          承载集未被本次修正触及 (只改了 SC-1 / SC-5 两行), 1.4 仍不在其中, 该旁挂法仍是
          正确处置, 不随 SC-1/SC-5 一起转正, 不得因为"顺手也转正掉"而扩权。
      `sc_coverage_crosscheck` 的 SC-1 / SC-5 / SC-6 (SC-6 另因 TASK-029 新增而变) 三行、
      `uncovered: []` 均已同步, 详见文件对应位置。
    recommendation: |
      (原 v9 建议, 已由 owner 裁定采纳其等价物 [裁定 2], 本字段保留作历史记录, 不再是待办)
      在 proposal 里写死「承载」的定义, 二选一并把表按该定义重算:
        (1) 采读法 A ⇒ 从 SC-6/14/15/16/20/21 移除实现 Task, 表只列验证物产出方; 或
        (2) 采读法 B ⇒ 给 SC-1 补 1.3、给 SC-5 补 1.2, 表列「被验方 + 验证物产出方」两列。
      建议 (2) —— 它能同时保留「谁被验」这个 Phase B 真正需要的信息, 且与 Task 1.3 正文
      已有的「验收 = SC-x」写法同源。**本条不由 A.2 执笔方自行裁定** (**v10 勘正引用条款**:
      原引 Rule #10, 现改引 **INV-2 + proposal.md:19 的本 spec 局部先例** —— INV-2 明文
      「SC → Task 全表不得被分解破坏」; proposal.md:19 已建立「Phase B 撞到 (机械闸) 覆盖
      缺口须回报 owner、不得就地自行裁定」这条本 spec 内部先例。两者合起来即是"已过闸产物
      的定义缺口须回报 owner 裁定"的 spec 局部依据, 不必外部引用更重的 Rule #10 —— Rule #10
      讲的是"不得自行豁免 enabled 闸门", 而这里从来不是要不要豁免闸门, 是闸门产物本身有没有
      定义缺口, 引 Rule #10 属于**证据类别与解法类别不匹配** [memory
      `feedback_match_evidence_class_to_solution_class`], v10 已改正)。owner 已按此裁定
      (裁定 2), 本条到此闭环。

