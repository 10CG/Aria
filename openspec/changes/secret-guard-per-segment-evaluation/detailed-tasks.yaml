      - "⚠️ **跨任务引号状态机一致性契约 (v10, 你 R1 F2/Major-2, 与 TASK-003 共同持有)**: 本任务与 TASK-003 (`split_top()`) 都需要「逐字符引号/转义追踪」, 但各自独立实现时可能对单引号 / 双引号 / `$'...'` ANSI-C 转义 / 反引号内转义规则处理不一致 (SC-4 存在的部分原因)。**两任务必须共用同一份引号状态机约定**: 逐字符扫描, 状态优先级固定为「转义 (`\\`) → 单引号 → 双引号 → `$'...'`」, 不得两任务各自发明顺序。**验收**: 补一组含引号/转义/反引号混合的探针 (至少覆盖: 单引号内的 `;`、双引号内的 `&&`、`$'...'` 内的换行、反引号内的管道 `|`), 同时喂本任务的块字符判据与 TASK-003 的 `split_top()`, 逐字符断言二者对「该字符是否落在引号内」的判定完全一致"
    notes: "引号感知**只对本行成立** — §What.1 表头的「引号外」限定词不统摄关键字/作用域/后台记号三行 (R6 SFH-m1)。"

