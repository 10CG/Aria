  version_reference_surface:
    # R1/code-reviewer Critical-1 的根因: 三份文档都按「文件数」枚举同步面, 而错误的
    # 维度是「版本引用点数」。以下为 2026-08-08 实测 (grep -rn "1\.65\.5")。
    main_repo_points: 14
    aria_side_normal_points: 4    # 3 个文件 4 个点 (marketplace.json 含 2)
    total_normal_points: 18
    breakdown:
      "README.md": 2          # badge + "Plugin Version:" 行
      "README.zh.md": 3       # translated-from + badge + "Plugin Version:" 行
      "README.ja.md": 3
      "README.ko.md": 3
      "CLAUDE.md": 2          # 版本区间行 + 「版本:」行
      "VERSION": 1            # 子模块版本表行
      # R3-fix (三席命中): aria 侧此前结构性缺席 ⇒ 计数断言退化为「≥1」,
      # 实测把 aria/README.md 写成 "1.66.O" (字母 O) 判 GREEN
      "aria/.claude-plugin/plugin.json": 1
      "aria/.claude-plugin/marketplace.json": 2   # :3 与 :16
      "aria/README.md": 1
    plus: "主仓 gitlink (非文本引用) + aria 子模块 5 文件"
    enabled_check_blindness: >
      m6-version-badge-match 只比 README.md 的 badge; i18n-readme-translation-currency
      只比 translated-from 标记 ⇒ README.md 的 "Plugin Version:" 行 + i18n ×3 的 badge 与
      "Plugin Version:" 行等共 **10 处** (R2-fix 曾写 7, R4 实算 10) 残留旧版本时两条 enabled check 仍全绿 = 假绿。
    mechanical_fix: >
      TASK-024 的**双向 + 整仓差集**断言。**R4-fix 关键升级 (R4/completeness-lens 单点最优建议)**:
      原设计是**文件白名单** ⇒ 对**未来新增的版本引用点 fail-OPEN** (修了实例没修类), 且逼着
      人去数「失明几处」(R2-fix 写 7, 实为 **10** —— 漏计 CLAUDE.md 2 + VERSION 1)。
      改为**整仓 grep 差集**: bump 后对**全部 tracked 文件** grep 旧版本号, 命中集合减去**显式
      成文的排除集** (版本史 + 审计史 + Spec 自身的订正留痕) 必须为**空**; 任何未在排除集里的
      新命中即红。⇒ 「失明几处」变成不必算的数, 且新增引用点自动被覆盖 (fail-CLOSED)。
      判据依据: memory `feedback_invariant_dimension_must_match_error_dimension` +
      `feedback_invariant_needs_failclosed_default` (正向白名单对新值天然 fail-OPEN)。
    two_classes_of_file:
      # R2/tech-lead N2 + code-reviewer N-1: R1-fix 把两类混在一条零命中断言里, 造出恒红
      normal_reference:
        files: ["VERSION", "README.md", "README.zh.md", "README.ja.md", "README.ko.md", "CLAUDE.md",
                "aria/.claude-plugin/plugin.json", "aria/.claude-plugin/marketplace.json", "aria/README.md"]
        invariant: "旧值零命中 **且** 新值出现次数 == 该文件预期点数 (先枚举预期值再断言)"
      append_only_ledger:
        files: ["aria/VERSION", "aria/CHANGELOG.md"]
        invariant: >
          **不做零命中** (历史保留旧版本号是正确的)。双向判据 = (a) **全部**「当前版本」声明
          == plugin.json; **且** (b) **文件行数不减** (append-only 的可靠不变量)。
        why_not_old_value_count: >
          ⚠️ **R4-fix 第三次更正同一处**: R3-fix 写「旧值命中数 ≥2」是恒红 (`:3` 是 bump 必须改
          掉的当前版本行, 正确执行后剩 1); R4 中途改成「≥1」**同样不可靠** —— 实测旧版本在
          aria/VERSION 的保留形态**不一致**: `1.65.4` **0 次** · `1.65.3` **0 次** · `1.65.2` 1 次 ·
          `1.65.1` 1 次 · `1.64.0` 1 次。⇒ 「历史行原样保留」这个前提**本身不成立**, 任何基于
          旧值命中数的阈值都会对某些 bump 恒红。**改用「行数不减」** —— 它直接对应「不许销毁
          历史」这个真实意图, 且不假设任何保留形态。
          *(同一处三次踩同一个坑, 记于此: 每次我都在「修恒红」的编辑里造新恒红 —— memory
          `feedback_fix_recurs_in_its_own_fallback_path`。)*
        known_stale_second_declaration: >
          ⚠️ **`aria/VERSION:60-64` 有第二处当前版本声明** (`## 版本号` 围栏块; R5 行号复核), 实读为
          **`1.47.0`** —— 陈旧 18 个版本, 正是 aria-report **#158** 「版本字段污染」的那个冻结串
          (该 issue 的修法是把消费方改读 `plugin.json` SOT, 并未修这个块本身)。
          ⇒ 判据 (a) 写「**全部**当前版本声明」而非「头部」—— 原措辞会静默排除它。
          **该块的陈旧本身是 pre-existing 缺陷, 不在本 Spec 范围**, 但实施者须知道它存在。
      one_sided_assertion_is_half_dimension: >
        只断言旧值缺席是**缺席断言**: 删行 / 写错新版本号都判绿 (R2/tech-lead N3)。故必须双向。
    aria_side_points: "**3 个**普通引用文件 / **4 个**点 (marketplace.json 含 2 个 version 字段 :3/:16) — R2-fix 误写成「4 个文件」, 与本 Spec 反复强调的「文件数 ≠ 引用点数」同形状复发 (R3-fix 已改)"

