  - id: TASK-005
    parent: "4.1, 4.2, 4.3, 4.4"
    title: "【辅助】切口2 — 并发 churn 检测 (state-scanner, advisory)"
    status: pending
    complexity: M
    dependencies: [TASK-000, TASK-002]
    agent: backend-architect
    deliverables: [aria/skills/state-scanner/]
    description: >
      阶段 2 advisory iff `collision.kind!=none` 且 config `coordination.enabled==false` (config 读)。
