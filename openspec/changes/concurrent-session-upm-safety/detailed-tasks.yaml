      (collision helper 按 owner+container 归类)。提示含一键启用片段。不 auto-enable。
    verification:
      - "并发 fixture (真实 collector 输出) → advisory; disjointness 两态互斥可测"
      - "collision none + behind 0 → advisory 不出现 (负向 AC-3); grep 无 auto-enable"

  - id: TASK-006
    parent: "5.1, 5.2, 5.3, 5.4"
    title: "【辅助】切口1 — phase-d-closer fetch-gate (fail-soft advisory)"
    status: pending
    complexity: M
    dependencies: [TASK-000, TASK-002]
    agent: backend-architect
    deliverables: [aria/skills/phase-d-closer/]
    description: >
      D.1 写 UPM 前: default-branch 解析 (symbolic-ref→master→main, sync.py chain) + fresh fetch
      (timeout=30, 独立 1.16 缓存; 失败复用 coordination_fetch error_kind + soft-warn, 不回显 raw stderr,
      不阻塞) + behind-check (git.py 手法)。触发 iff behind>0 且 (collision!=none 或 触及 upm.source_file
      [git log --name-only ∩]); 触及 UPM→强提示; 纯 behind>0→静默。fail-soft ≠ C.2.4.5 fail-hard。
    verification:
      - "origin ahead + UPM-touch → 强提示; ahead 非 UPM + collision none → 静默"
      - "离线 fixture → soft-warn 不阻断 (测 fail-soft 路径)"

