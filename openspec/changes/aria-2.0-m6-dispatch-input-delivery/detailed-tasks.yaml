  - id: TASK-017
    parent: "5.4,5.5"
    title: "layer-boundary-contract.md §5 Task Content Delivery Mechanism (双通道 file/fetch schema + file-mode lifecycle) + CLAUDE.md M6 依赖链更新"
    status: pending
    complexity: M
    dependencies: [TASK-016]
    deliverables: [aria-orchestrator/docs/layer-boundary-contract.md, CLAUDE.md]
    agent: knowledge-manager
    verification: ["AC-10 部分: §5 added; CLAUDE.md input-delivery↔遥测依赖链 (fetch-before-edit 高 contention)"]

  # ───────────────────────── TG-6 E2E dogfood + pre-run (qa-engineer) ─────────────────────────
  - id: TASK-018
    parent: "6.1"
    title: "heavy 节点 Forgejo egress/auth live-test (fetch 可达性, 跑前)"
    status: pending
    complexity: S
    dependencies: []  # 可早跑 (prereq 探针)
    deliverables: ["egress live-test 结果记录"]
    agent: qa-engineer
    verification: ["heavy 节点容器出站可达内网 Forgejo + PAT auth OK (防 CF-Access 伪成功页)"]

  - id: TASK-019
    parent: "6.2"
    title: "E2E dogfood: 真数字-id 自主 dispatch → S9_CLOSE with merged PR (非仅单测)"
    status: pending
    complexity: L
    dependencies: [TASK-006, TASK-011, TASK-012, TASK-013, TASK-015, TASK-018]
    deliverables: ["E2E dogfood 记录 (dispatch → S9/merged PR)"]
    agent: qa-engineer
    verification: ["AC-1 (最重要门): 真数字-id 自主 dispatch 到 S9_CLOSE + merged PR"]

  - id: TASK-020
    parent: "6.3"
    title: "验证 fetch 失败对 Layer 1 可区分 infra-fail vs agent-fail"
    status: pending
    complexity: M
    dependencies: [TASK-011, TASK-019]
    deliverables: ["fail-mode 区分验证记录"]
    agent: qa-engineer
    verification: ["AC-6: INPUT_FETCH_FAILED 与 CONTAINER_CRASH 两分支实测可区分"]

execution_order:
  # 拓扑排序 (尊重 DAG); TG-1↔TG-2 co-dependent 同 scope 落地
  phase_1_parallel_start: [TASK-001, TASK-005, TASK-007, TASK-018]  # 无前置, 可并行起
  critical_path: "TASK-001→002→003/004→006→(011)→019 (container fetch + 三态 + Layer1 消费 + E2E)"
  gates:
    image_build: "TASK-015 gates on 全 TG-1 (001-006)"
    e2e_dogfood: "TASK-019 gates on 006+011+012+013+015+018 全部部署"
  co_dependency: "TG-1 (001-006) 与 TG-2 (007-012) 必须同 scope 一起落 (regex 先于输入加载; 缺 Layer1 则修复不生效 — qa OBJECTION ①)"

