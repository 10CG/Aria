  planning_gate: "已真实执行post_planning R1..R5；R5 check终态OSCILLATION、末轮PASS、两席准入/三席未准入、converged=false，依既有振荡路由采用末轮，不能说已收敛或五席通过。A.1另有真实accept_current sidecar。全流程修复授权及这两项合法终态允许进入B；后续所有启用闸门仍按配置执行。"
  prior_disposition: "post_spec R5 三席准入全 PASS、两席未准入，5/5 耗尽后 owner 真实选择 accept_current；canonical collect/check 已追加 seq17 disposition，checked sidecar SHA256 f197f9c92498cdb461213b53ea53084a44160cef85c20395c560a2e36f0c848d，overridden_by_user=true、converged=false；不是收敛或全员通过。"
  execution_rules:
    - "任务进度以各项 status 为准；子代理不提交，主控统一协调、提交和集成；同一文件写域严格按 dependencies 串行，修复审查反馈亦先取得该写域。"
    - "重实验同一时刻仅一个，nice 19、限 2 核；审计并发不超过 2；按实际运行记录资源与结果。"
    - "测试必须有 judged 明细；SKIP、not_judged、编译失败不能算 PASS 或 CAUGHT；坏实现须编译并命中指定业务断言。"
    - "PR #38 继续暂停，不部署、不启动 168h；旧已接受 B19/19 不重做；旧 297 与新回归分开记，广域 #209/#210 不自动关闭。"
    - "完整原生记录、ledger、保全 payload、secret 不入公开 Git；只公开允许的筛选结果、哈希和非敏感证据。"
    - "Rule6证据只覆盖其实际输入和hunk：审查反馈、版本/文档同步或集成冲突处理改变交付diff后，必须对变化hunk重新判性质并实际执行适用substitute/skill-creator场景；记录新输入版本/文件hash及rule6_note，旧输入不冒充最终验证。TASK-016/017必须对照最终包核其适用面；不符返工TASK-014/015，不以重生成catalog代替重验证。"

