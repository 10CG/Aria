      - "套件 (1) 搬入方式 (PP2-P、PP2-m15): sc-cases.sh 与 sc-direct.sh 的用例改写成套件里的 bash 用例, 编号不变 (V<k>-...); 断言与期望值照搬, 下面 R2 补强改动的除外。shim/delay-first 以文件复制进 tests/, jq、sed 两个名字用符号链接, 写进套件头注释; shapes.py 不搬 Python, 改写成 bash 的输入生成函数 (套件头注释「python3 只给 SC-20 用」保持为真; 2026-10-24 注: 这句改动前已不实, 见 notes 的 3a 主控裁定 (6))。只有新用例按 SC_BASH 选执行 hook 的 bash, 旧用例照旧; 被测 bash 的能力探测问的是执行 hook 的那个 bash。直调用例用 _SG_P0=${EPOCHREALTIME:-} (set -u 下 3.2 没有该变量)"
