      - "R2 补强 (b) 放行方向 (PP2-D 到 PP2-J、PP2-m12): 为 R2 汇总「非作者变异测试汇总」的 12 类各补至少一条确定性用例 (优先直调, 不靠墙钟): 分段触发点问准入门; 项目根只经 stdin cwd 给出; 重跑内的 for 计数; 重跑内的 VMAX; 重跑内三个时间检查点返回 3 且不写文案; 超长行加过滤器在整串与分段都拦 (含首尾空白撑长的行); 整串分支调 _sg_vx_big_judge 后返回它的结论; 增长超限在整串与分段都拦 (kind=growth); 作业在非组长 shell 里返回 9; TERM 被忽略时截止仍生效; 分段回落原因串与基线逐字节相同; LMAX 8192 / 8193 边界与量不出行长时的哨兵。材料: QA 的 xp-newcases.sh (17 个确定性探针)、BA 的 demo78.sh 与 stub-*.sh、TL 的 probes*.py、CR 的 probes/mk.py, 路径见 .aria/audit-reports/post_planning-R2-1792689337848-secret-guard-w10-failclosed-narrowing-aggregated.md"
