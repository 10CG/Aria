          git -C aria show <c>:skills/phase-c-integrator/scripts/pre_merge_gate.py | grep -c '"not_found"'   # 合取 3: ≥1
          git -C aria show --stat <c> | grep -c -E 'aether.py|pre_merge_gate.py'                             # 合取 4: == 2
        历史 aether.py 与当前树 base.py 组合 (本 spec 不动 base.py)。
        **TASK-003 实跑勘正 (2026-08-22)**: 合取 4 的 `git show --stat` 含 commit message 正文 — message 里出现文件名字面 (如「aether.py :225」) 会把计数推到 3 (实测), 与文件集无关; 已 amend 去掉字面后 == 2。稳健形式 `git show --stat --format= <c>` 只数文件行; TASK-013 复核用两种形式都跑, 以 --format= 为准。assert 使失败 = 非零退出; 反例 (sed 零 run 分支为
        not_found 后) 合取 1 如期 FAIL (R4 A1 实测); 主控与 R5 A2/A5 在 HEAD 复跑通过。
